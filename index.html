<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estudio Socioeconómico - Vivienda 2023</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Chart.js para gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
        }
        #map {
            height: 100vh;
            width: 100%;
        }

        .control-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 12px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            max-width: 270px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            max-height: 95vh;
            overflow-y: auto;
            font-size: 11px;
        }
        .control-panel h3 {
            font-size: 13px;
            color: #1a2a3a;
            border-bottom: 2px solid #d94f4f;
            padding-bottom: 4px;
            margin-bottom: 6px;
        }
        .control-panel label {
            font-weight: 600;
            font-size: 10px;
            color: #2c3e50;
            display: block;
            margin-top: 5px;
            margin-bottom: 2px;
        }
        .control-panel select {
            width: 100%;
            padding: 3px 6px;
            border-radius: 5px;
            border: 1px solid #ccc;
            background: white;
            font-size: 10px;
            cursor: pointer;
        }
        .control-panel select:focus {
            outline: none;
            border-color: #d94f4f;
            box-shadow: 0 0 0 2px rgba(217, 79, 79, 0.2);
        }

        /* Buscador */
        .search-container {
            margin-top: 5px;
            display: flex;
            gap: 4px;
        }
        .search-container input {
            flex: 1;
            padding: 3px 6px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 10px;
            outline: none;
        }
        .search-container input:focus {
            border-color: #d94f4f;
            box-shadow: 0 0 0 2px rgba(217, 79, 79, 0.2);
        }
        .search-container button {
            padding: 3px 8px;
            border-radius: 5px;
            border: none;
            background: #d94f4f;
            color: white;
            font-size: 10px;
            cursor: pointer;
        }
        .search-container button:hover {
            background: #b33a3a;
        }

        /* Botones de acción */
        .action-buttons {
            display: flex;
            gap: 4px;
            margin-top: 5px;
        }
        .action-buttons button {
            flex: 1;
            padding: 3px 6px;
            border-radius: 5px;
            border: none;
            font-size: 9px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn-export {
            background: #2a8b5e;
            color: white;
        }
        .btn-export:hover {
            background: #1e6b47;
        }
        .btn-stats {
            background: #2c6b9e;
            color: white;
        }
        .btn-stats:hover {
            background: #1e4f7a;
        }

        .filtros-container {
            margin-top: 5px;
            padding: 5px 7px;
            background: #f8f9fa;
            border-radius: 5px;
            border-left: 3px solid #d94f4f;
            max-height: 160px;
            overflow-y: auto;
        }
        .filtros-container h4 {
            font-size: 10px;
            color: #1a2a3a;
            margin-bottom: 3px;
        }
        .filtro-checkbox {
            display: flex;
            align-items: center;
            margin: 2px 0;
            font-size: 10px;
            color: #2c3e50;
            cursor: pointer;
            padding: 1px 4px;
            border-radius: 3px;
        }
        .filtro-checkbox:hover {
            background: #e9ecef;
        }
        .filtro-checkbox input[type="checkbox"] {
            margin-right: 5px;
            width: 12px;
            height: 12px;
            accent-color: #d94f4f;
            flex-shrink: 0;
        }
        .filtro-checkbox .color-muestra {
            width: 14px;
            height: 10px;
            border-radius: 2px;
            margin-right: 5px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }
        .filtro-checkbox .count-badge {
            margin-left: auto;
            font-size: 8px;
            background: #e9ecef;
            padding: 0 5px;
            border-radius: 8px;
            color: #555;
        }

        .btn-reset {
            background: #d94f4f;
            color: white;
            border: none;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 9px;
            cursor: pointer;
            margin-top: 3px;
            width: 100%;
            font-weight: 600;
        }
        .btn-reset:hover {
            background: #b33a3a;
        }

        .select-all-container {
            display: flex;
            gap: 4px;
            margin-bottom: 3px;
        }
        .select-all-container button {
            font-size: 9px;
            padding: 1px 6px;
            border: 1px solid #ccc;
            border-radius: 3px;
            background: white;
            cursor: pointer;
        }
        .select-all-container button:hover {
            background: #e9ecef;
        }

        .info-box {
            margin-top: 5px;
            font-size: 10px;
            color: #34495e;
            background: #f8f9fa;
            padding: 5px 7px;
            border-radius: 5px;
            border-left: 3px solid #d94f4f;
            line-height: 1.4;
        }
        .info-box strong {
            color: #1a2a3a;
        }
        .info-box .valor {
            font-weight: 700;
            color: #d94f4f;
        }
        .info-box .stats {
            font-size: 9px;
            color: #666;
            margin-top: 2px;
            border-top: 1px dashed #ddd;
            padding-top: 2px;
        }
        .info-box .stats span {
            font-weight: 700;
            color: #1a2a3a;
        }

        .legend {
            margin-top: 5px;
            padding: 5px 7px;
            background: #f8f9fa;
            border-radius: 5px;
            font-size: 9px;
        }
        .legend-title {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 3px;
            font-size: 10px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 2px 0;
        }
        .legend-color {
            width: 14px;
            height: 10px;
            border-radius: 2px;
            margin-right: 5px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }
        .legend-text {
            font-size: 9px;
            color: #2c3e50;
        }

        .legend-desc {
            font-size: 8px;
            color: #888;
            margin-top: 3px;
            padding-top: 3px;
            border-top: 1px dashed #ddd;
            font-style: italic;
        }

        /* Modal de estadísticas */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(2px);
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        .modal-content h3 {
            font-size: 16px;
            color: #1a2a3a;
            margin-bottom: 12px;
            border-bottom: 2px solid #d94f4f;
            padding-bottom: 6px;
        }
        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 22px;
            cursor: pointer;
            color: #888;
            background: none;
            border: none;
        }
        .modal-close:hover {
            color: #d94f4f;
        }
        .modal-content canvas {
            max-height: 300px;
            max-width: 100%;
        }
        .modal-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 12px;
            font-size: 11px;
        }
        .modal-stats .stat-item {
            background: #f8f9fa;
            padding: 6px 10px;
            border-radius: 5px;
            text-align: center;
        }
        .modal-stats .stat-item .num {
            font-weight: 700;
            color: #d94f4f;
            font-size: 14px;
        }
        .modal-stats .stat-item .label {
            color: #666;
            font-size: 9px;
        }

        .footer {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 3px 12px;
            border-radius: 14px;
            font-size: 9px;
            backdrop-filter: blur(2px);
            pointer-events: none;
            white-space: nowrap;
        }

        @media (max-width: 600px) {
            .control-panel {
                top: 6px;
                right: 6px;
                max-width: 200px;
                padding: 6px 8px;
            }
            .control-panel h3 {
                font-size: 11px;
            }
            .control-panel select {
                font-size: 9px;
                padding: 2px 5px;
            }
            .filtros-container {
                max-height: 120px;
                padding: 4px 5px;
            }
            .filtro-checkbox {
                font-size: 9px;
            }
            .legend {
                font-size: 8px;
                padding: 4px 5px;
            }
            .info-box {
                font-size: 9px;
                padding: 4px 5px;
            }
            .footer {
                font-size: 7px;
                padding: 2px 8px;
            }
            .modal-content {
                padding: 14px;
                max-width: 95%;
            }
            .modal-stats {
                grid-template-columns: 1fr 1fr;
                gap: 4px;
            }
            .search-container input {
                font-size: 9px;
                padding: 2px 4px;
            }
            .action-buttons button {
                font-size: 8px;
                padding: 2px 4px;
            }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Modal de Estadísticas -->
    <div class="modal-overlay" id="statsModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeStats()">&times;</button>
            <h3 id="statsTitle">📊 Estadísticas del indicador</h3>
            <canvas id="statsChart"></canvas>
            <div class="modal-stats" id="statsNumbers">
                <!-- Se llena con JS -->
            </div>
        </div>
    </div>

    <div class="control-panel">
        <h3>📊 Explorador socioeconómico</h3>

        <label for="map-select">🗺️ Mapa base:</label>
        <select id="map-select">
            <option value="satellite">🛰️ Satélite</option>
            <option value="osm">🌍 OpenStreetMap</option>
            <option value="topo">🗺️ Topográfico</option>
        </select>

        <label for="variable-select">📈 Indicador:</label>
        <select id="variable-select">
            <option value="CAT_DENS" selected>🏷️ Categoría de densidad</option>
            <option value="DENS_POB">👥 Densidad poblacional</option>
            <option value="VIV_OCUP">🏠 Viviendas ocupadas</option>
            <option value="PORC_OCU">📊 % Ocupación</option>
            <option value="PERS_VIV">👤 Pers./viv. ocupada</option>
        </select>

        <!-- Buscador -->
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="🔍 Buscar provincia/distrito..." />
            <button onclick="buscarPoligonos()">Buscar</button>
        </div>

        <!-- Botones de acción -->
        <div class="action-buttons">
            <button class="btn-stats" onclick="mostrarEstadisticas()">📊 Estadísticas</button>
            <button class="btn-export" onclick="exportarCSV()">💾 Exportar CSV</button>
        </div>

        <div id="filtros-container" class="filtros-container">
            <!-- Se llena con JS -->
        </div>

        <div class="info-box" id="info-box">
            <strong id="info-label">Categoría de densidad</strong><br />
            <span id="info-value">Selecciona un polígono</span>
            <div class="stats" id="stats-info">Mostrando: <span id="count-mostrados">0</span> de <span id="count-total">0</span> polígonos</div>
        </div>

        <div id="legend" class="legend">
            <!-- Se llena con JS -->
        </div>
    </div>

    <div class="footer">Datos: Estudio Socioeconómico 2023 – RAUL VIQUEZ</div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ================================================================
        // 1. MAPA Y CAPAS BASE
        // ================================================================
        const map = L.map('map', { center: [8.0, -80.0], zoom: 7 });

        const satelliteLayer = L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri',
                maxZoom: 19
            }
        );
        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        });
        const topoLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenTopoMap',
            maxZoom: 17
        });

        satelliteLayer.addTo(map);

        // ================================================================
        // 2. VARIABLES GLOBALES
        // ================================================================
        let currentLayer = null;
        let currentVariable = 'CAT_DENS';
        let geoJsonData = null;
        let allFeatures = [];
        let filtrosActivos = {};
        let chartInstance = null;
        let currentFeaturesFiltradas = [];

        // ================================================================
        // 3. PALETAS DE COLORES
        // ================================================================
        const catColors = {
            'MUY_BAJA': '#fcbba1',
            'BAJA': '#fc9272',
            'MEDIA_BAJA': '#fb6a4a',
            'MEDIA': '#de2d26',
            'ALTA': '#a50f15',
            'MUY_ALTA': '#67000d',
            'SIN_DATOS': '#b0b0b0'
        };

        const catLabels = {
            'MUY_BAJA': 'Muy baja (<100 hab/km²)',
            'BAJA': 'Baja (100-500)',
            'MEDIA_BAJA': 'Media-Baja (500-2000)',
            'MEDIA': 'Media (2000-5000)',
            'ALTA': 'Alta (5000-10000)',
            'MUY_ALTA': 'Muy alta (>10000)',
            'SIN_DATOS': 'Sin datos'
        };

        const numPalettes = {
            'DENS_POB': ['#fcbba1', '#fc9272', '#fb6a4a', '#de2d26', '#a50f15', '#67000d'],
            'VIV_OCUP': ['#a1d99b', '#74c476', '#41ab5d', '#238b45', '#005a32'],
            'PORC_OCU': ['#fdd0a2', '#fdae6b', '#f16913', '#d94801', '#8c2d04'],
            'PERS_VIV': ['#bcbddc', '#9e9ac8', '#807dba', '#6a51a3', '#4a1486']
        };

        const rangosFijos = {
            'DENS_POB': {
                min: 0,
                max: 20000,
                steps: 6,
                nombres: [
                    'Muy baja (<100)',
                    'Baja (100-500)',
                    'Media-Baja (500-2000)',
                    'Media (2000-5000)',
                    'Alta (5000-10000)',
                    'Muy alta (>10000)'
                ],
                limites: [0, 100, 500, 2000, 5000, 10000, 20000]
            },
            'PERS_VIV': {
                min: 0,
                max: 6,
                steps: 5,
                nombres: ['Muy bajo (0.0–1.2)', 'Bajo (1.2–2.4)', 'Medio (2.4–3.6)', 'Alto (3.6–4.8)', 'Muy alto (4.8–6.0)']
            },
            'PORC_OCU': {
                min: 0,
                max: 100,
                steps: 5,
                nombres: ['Muy bajo (0–20%)', 'Bajo (20–40%)', 'Medio (40–60%)', 'Alto (60–80%)', 'Muy alto (80–100%)']
            },
            'VIV_OCUP': {
                min: 0,
                max: 8000,
                steps: 5,
                nombres: ['Muy bajo (0–1600)', 'Bajo (1600–3200)', 'Medio (3200–4800)', 'Alto (4800–6400)',
                    'Muy alto (6400–8000)'
                ]
            }
        };

        const rangosNombres = {
            'VIV_OCUP': ['Muy pocas', 'Pocas', 'Medias', 'Muchas', 'Muchísimas'],
            'PORC_OCU': ['Muy bajo', 'Bajo', 'Medio', 'Alto', 'Muy alto'],
            'PERS_VIV': ['Muy bajo', 'Bajo', 'Medio', 'Alto', 'Muy alto']
        };

        const descripcionIndicador = {
            'CAT_DENS': 'Clasificación del territorio según densidad poblacional (hab/km²). Útil para identificar zonas urbanas y rurales.',
            'DENS_POB': 'Número de habitantes por kilómetro cuadrado. Indica la concentración poblacional.',
            'VIV_OCUP': 'Cantidad de viviendas actualmente habitadas. Excluye viviendas desocupadas, en construcción o abandonadas.',
            'PORC_OCU': 'Porcentaje de viviendas ocupadas respecto al total. Valores altos indican baja desocupación.',
            'PERS_VIV': 'Promedio de personas por vivienda ocupada. Valores altos pueden indicar hacinamiento.'
        };

        const variableLabels = {
            'CAT_DENS': 'Categoría de densidad',
            'DENS_POB': 'Densidad poblacional (hab/km²)',
            'VIV_OCUP': 'Viviendas ocupadas',
            'PORC_OCU': '% Ocupación',
            'PERS_VIV': 'Personas por vivienda ocupada'
        };

        function getColorByValue(variable, value, min, max) {
            if (isNaN(value) || value === null) return '#b0b0b0';

            if (variable === 'CAT_DENS') {
                return catColors[value] || '#b0b0b0';
            }

            const palette = numPalettes[variable] || numPalettes['DENS_POB'];
            let t;

            if (variable === 'DENS_POB') {
                const limites = [0, 100, 500, 2000, 5000, 10000, 20000];
                for (let i = 0; i < limites.length - 1; i++) {
                    if (value >= limites[i] && value < limites[i + 1]) {
                        t = i / (limites.length - 2);
                        break;
                    }
                }
                if (value >= 20000) t = 1;
                const index = Math.min(Math.floor(t * (palette.length - 1)), palette.length - 1);
                return palette[index];
            }

            if (rangosFijos[variable]) {
                const r = rangosFijos[variable];
                t = (value - r.min) / (r.max - r.min);
                t = Math.max(0, Math.min(1, t));
            } else {
                t = (value - min) / (max - min + 0.0001);
            }
            const index = Math.min(Math.floor(t * palette.length), palette.length - 1);
            return palette[index];
        }

        function getRangoIndex(variable, value) {
            if (isNaN(value) || value === null) return 0;

            if (variable === 'DENS_POB') {
                const limites = [0, 100, 500, 2000, 5000, 10000, 20000];
                for (let i = 0; i < limites.length - 1; i++) {
                    if (value >= limites[i] && value < limites[i + 1]) {
                        return i;
                    }
                }
                return limites.length - 2;
            }

            if (rangosFijos[variable]) {
                const r = rangosFijos[variable];
                const t = (value - r.min) / (r.max - r.min);
                return Math.min(Math.floor(t * r.steps), r.steps - 1);
            }
            return 0;
        }

        // ================================================================
        // 4. BUSCADOR
        // ================================================================
        function buscarPoligonos() {
            const texto = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!texto || !geoJsonData) return;

            // Buscar features que coincidan con provincia o distrito
            const encontrados = allFeatures.filter(f => {
                const prov = (f.properties.PROVINCIA || '').toLowerCase();
                const dist = (f.properties.DISTRITO || '').toLowerCase();
                return prov.includes(texto) || dist.includes(texto);
            });

            if (encontrados.length === 0) {
                alert('No se encontraron polígonos con: ' + texto);
                return;
            }

            // Crear un GeoJSON temporal con los encontrados
            const geoJsonEncontrados = {
                type: 'FeatureCollection',
                features: encontrados
            };

            // Eliminar capa actual y mostrar solo los encontrados
            if (currentLayer) {
                map.removeLayer(currentLayer);
                currentLayer = null;
            }

            currentLayer = L.geoJSON(geoJsonEncontrados, {
                style: function(feature) {
                    let value = feature.properties[currentVariable];
                    let color = '#b0b0b0';
                    if (currentVariable === 'CAT_DENS') {
                        color = catColors[value] || '#b0b0b0';
                    } else {
                        const numVal = parseFloat(value);
                        if (!isNaN(numVal) && numVal !== null) {
                            const r = rangosFijos[currentVariable];
                            const min = r ? r.min : 0;
                            const max = r ? r.max : 1;
                            color = getColorByValue(currentVariable, numVal, min, max);
                        }
                    }
                    return {
                        fillColor: color,
                        weight: 2,
                        opacity: 0.9,
                        color: '#000000',
                        fillOpacity: 0.85
                    };
                },
                onEachFeature: function(feature, layer) {
                    const p = feature.properties;
                    const areaM2 = p.AREA || 0;
                    const areaKm2 = areaM2 / 1000000;

                    const popupContent = `
                            <div style="font-family:'Segoe UI',sans-serif;min-width:170px;max-width:240px;font-size:11px;">
                                <h4 style="margin:0 0 2px 0;color:#1a2a3a;font-size:12px;">${p.PROVINCIA || 'N/D'} – ${p.DISTRITO || 'N/D'}</h4>
                                ${p.BARR_NOMB ? `<div style="font-size:10px;color:#666;margin-bottom:2px;">📍 ${p.BARR_NOMB}</div>` : ''}
                                <hr style="margin:3px 0;border:0;border-top:1px solid #ddd;">
                                <table style="width:100%;font-size:10px;line-height:1.4;">
                                    <tr><td><strong>Viviendas:</strong></td><td>${p.VIVIENDA || 0}</td></tr>
                                    <tr><td><strong>Personas:</strong></td><td>${p.V_PERSONAS || 0}</td></tr>
                                    <tr><td><strong>Ocupadas:</strong></td><td>${p.VIV_OCUP || 0}</td></tr>
                                    <tr><td><strong>% Ocupación:</strong></td><td>${p.PORC_OCU ? p.PORC_OCU.toFixed(1) : 0}%</td></tr>
                                    <tr><td><strong>Densidad:</strong></td><td>${p.DENS_POB ? p.DENS_POB.toFixed(1) : 0} hab/km²</td></tr>
                                    <tr><td><strong>Pers./viv. ocupada:</strong></td><td>${p.PERS_VIV ? p.PERS_VIV.toFixed(2) : 0}</td></tr>
                                    <tr><td><strong>Categoría:</strong></td><td>${p.CAT_DENS || 'Sin datos'}</td></tr>
                                    <tr><td><strong>Área:</strong></td><td>${areaKm2.toFixed(2)} km² (${areaM2.toFixed(0)} m²)</td></tr>
                                </table>
                            </div>
                        `;
                    layer.bindPopup(popupContent);
                }
            }).addTo(map);

            // Ajustar zoom a los resultados
            const bounds = L.geoJSON(geoJsonEncontrados).getBounds();
            if (bounds.isValid()) {
                map.fitBounds(bounds, { padding: [40, 40] });
            }

            document.getElementById('count-mostrados').textContent = encontrados.length;
            document.getElementById('count-total').textContent = allFeatures.length;
            document.getElementById('info-value').textContent = `🔍 Resultados de búsqueda: ${encontrados.length} polígonos`;

            // Actualizar leyenda
            updateLegend(currentVariable, geoJsonEncontrados);
        }

        // ================================================================
        // 5. EXPORTAR CSV
        // ================================================================
        function exportarCSV() {
            if (!geoJsonData || allFeatures.length === 0) {
                alert('No hay datos para exportar');
                return;
            }

            const features = currentFeaturesFiltradas.length > 0 ? currentFeaturesFiltradas : allFeatures;

            // Crear cabeceras
            const headers = ['PROVINCIA', 'DISTRITO', 'BARR_NOMB', 'VIVIENDA', 'V_PERSONAS',
                'VIV_OCUP', 'PORC_OCU', 'DENS_POB', 'PERS_VIV', 'CAT_DENS', 'AREA_KM2'
            ];

            // Crear filas
            const rows = features.map(f => {
                const p = f.properties;
                return [
                    p.PROVINCIA || '',
                    p.DISTRITO || '',
                    p.BARR_NOMB || '',
                    p.VIVIENDA || 0,
                    p.V_PERSONAS || 0,
                    p.VIV_OCUP || 0,
                    p.PORC_OCU ? p.PORC_OCU.toFixed(1) : 0,
                    p.DENS_POB ? p.DENS_POB.toFixed(1) : 0,
                    p.PERS_VIV ? p.PERS_VIV.toFixed(2) : 0,
                    p.CAT_DENS || '',
                    ((p.AREA || 0) / 1000000).toFixed(4)
                ];
            });

            // Generar CSV
            let csv = headers.join(',') + '\n';
            rows.forEach(row => {
                csv += row.join(',') + '\n';
            });

            // Descargar
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `datos_socioeconomicos_${currentVariable}.csv`;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        // ================================================================
        // 6. ESTADÍSTICAS (Gráfico)
        // ================================================================
        let chartInstance = null;

        function mostrarEstadisticas() {
            const modal = document.getElementById('statsModal');
            modal.classList.add('active');

            const features = currentFeaturesFiltradas.length > 0 ? currentFeaturesFiltradas : allFeatures;
            const variable = currentVariable;

            document.getElementById('statsTitle').textContent = `📊 Estadísticas: ${variableLabels[variable] || variable}`;

            // Preparar datos para el gráfico
            let labels = [];
            let data = [];
            let colors = [];

            if (variable === 'CAT_DENS') {
                const categories = ['MUY_BAJA', 'BAJA', 'MEDIA_BAJA', 'MEDIA', 'ALTA', 'MUY_ALTA', 'SIN_DATOS'];
                const counts = {};
                categories.forEach(c => counts[c] = 0);
                features.forEach(f => {
                    const cat = f.properties[variable] || 'SIN_DATOS';
                    counts[cat] = (counts[cat] || 0) + 1;
                });
                labels = categories.map(c => catLabels[c] || c);
                data = categories.map(c => counts[c] || 0);
                colors = categories.map(c => catColors[c] || '#b0b0b0');
            } else {
                // Variables numéricas
                const r = rangosFijos[variable];
                const stepCount = r ? r.steps : 5;
                const nombres = r ? r.nombres : ['Muy bajo', 'Bajo', 'Medio', 'Alto', 'Muy alto'];
                const counts = new Array(stepCount).fill(0);

                features.forEach(f => {
                    const val = parseFloat(f.properties[variable]);
                    if (!isNaN(val) && val !== null) {
                        const idx = getRangoIndex(variable, val);
                        if (idx < counts.length) counts[idx]++;
                    }
                });

                labels = nombres;
                data = counts;
                if (r) {
                    colors = [];
                    for (let i = 0; i < stepCount; i++) {
                        const minVal = r.min + (r.max - r.min) * (i / stepCount);
                        const maxVal = r.min + (r.max - r.min) * ((i + 1) / stepCount);
                        colors.push(getColorByValue(variable, (minVal + maxVal) / 2, r.min, r.max));
                    }
                } else {
                    colors = ['#9ecae1', '#6baed6', '#4292c6', '#2171b5', '#084594'];
                }
            }

            // Estadísticas numéricas
            const statsDiv = document.getElementById('statsNumbers');
            let statsHTML = '';
            if (variable !== 'CAT_DENS') {
                const valores = features.map(f => parseFloat(f.properties[variable])).filter(v => !isNaN(v) && v !== null);
                if (valores.length > 0) {
                    const sum = valores.reduce((a, b) => a + b, 0);
                    const mean = sum / valores.length;
                    const sorted = [...valores].sort((a, b) => a - b);
                    const median = sorted.length % 2 === 0 ? (sorted[sorted.length / 2 - 1] + sorted[sorted.length / 2]) / 2 :
                        sorted[Math.floor(sorted.length / 2)];
                    const min = sorted[0];
                    const max = sorted[sorted.length - 1];

                    statsHTML = `
                            <div class="stat-item"><span class="num">${valores.length}</span><div class="label">Registros</div></div>
                            <div class="stat-item"><span class="num">${mean.toFixed(2)}</span><div class="label">Promedio</div></div>
                            <div class="stat-item"><span class="num">${median.toFixed(2)}</span><div class="label">Mediana</div></div>
                            <div class="stat-item"><span class="num">${min.toFixed(2)} - ${max.toFixed(2)}</span><div class="label">Mínimo - Máximo</div></div>
                        `;
                }
            } else {
                const total = data.reduce((a, b) => a + b, 0);
                statsHTML = `
                        <div class="stat-item"><span class="num">${total}</span><div class="label">Total polígonos</div></div>
                        <div class="stat-item"><span class="num">${data.filter(d => d > 0).length}</span><div class="label">Categorías con datos</div></div>
                    `;
            }
            statsDiv.innerHTML = statsHTML;

            // Crear gráfico
            if (chartInstance) {
                chartInstance.destroy();
            }

            const ctx = document.getElementById('statsChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Polígonos',
                        data: data,
                        backgroundColor: colors,
                        borderColor: colors.map(c => c),
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.parsed.y + ' polígonos';
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { font: { size: 9 } }
                        },
                        x: {
                            ticks: { font: { size: 8 }, maxRotation: 30 }
                        }
                    }
                }
            });
        }

        function closeStats() {
            document.getElementById('statsModal').classList.remove('active');
            if (chartInstance) {
                chartInstance.destroy();
                chartInstance = null;
            }
        }

        // Cerrar modal al hacer clic fuera
        document.getElementById('statsModal').addEventListener('click', function(e) {
            if (e.target === this) closeStats();
        });

        // ================================================================
        // 7. FILTROS
        // ================================================================
        function getFiltros() {
            const checkboxes = document.querySelectorAll('.filtro-checkbox input[type="checkbox"]');
            const activos = {};
            checkboxes.forEach(cb => { activos[cb.value] = cb.checked; });
            return activos;
        }

        function aplicarFiltros(features, variable) {
            const activos = getFiltros();
            const algunActivo = Object.values(activos).some(v => v === true);
            if (!algunActivo) return [];

            return features.filter(f => {
                let key;
                if (variable === 'CAT_DENS') {
                    key = f.properties[variable] || 'SIN_DATOS';
                    return activos[key] !== false;
                } else {
                    const val = parseFloat(f.properties[variable]);
                    if (isNaN(val) || val === null) return false;
                    const index = getRangoIndex(variable, val);
                    key = `rango_${index}`;
                    return activos[key] !== false;
                }
            });
        }

        // ================================================================
        // 8. ACTUALIZAR MAPA
        // ================================================================
        function updateMapWithFilters() {
            if (!geoJsonData) return;
            const variable = currentVariable;

            if (currentLayer) {
                map.removeLayer(currentLayer);
                currentLayer = null;
            }

            const featuresFiltradas = aplicarFiltros(allFeatures, variable);
            currentFeaturesFiltradas = featuresFiltradas;

            document.getElementById('count-mostrados').textContent = featuresFiltradas.length;
            document.getElementById('count-total').textContent = allFeatures.length;

            const geoJsonFiltrado = {
                type: 'FeatureCollection',
                features: featuresFiltradas
            };

            currentLayer = L.geoJSON(geoJsonFiltrado, {
                style: function(feature) {
                    let value = feature.properties[variable];
                    let color = '#b0b0b0';

                    if (variable === 'CAT_DENS') {
                        color = catColors[value] || '#b0b0b0';
                    } else {
                        const numVal = parseFloat(value);
                        if (!isNaN(numVal) && numVal !== null) {
                            const r = rangosFijos[variable];
                            const min = r ? r.min : 0;
                            const max = r ? r.max : 1;
                            color = getColorByValue(variable, numVal, min, max);
                        }
                    }
                    return {
                        fillColor: color,
                        weight: 1,
                        opacity: 0.8,
                        color: '#333333',
                        fillOpacity: 0.8
                    };
                },
                onEachFeature: function(feature, layer) {
                    const p = feature.properties;
                    const areaM2 = p.AREA || 0;
                    const areaKm2 = areaM2 / 1000000;

                    const popupContent = `
                            <div style="font-family:'Segoe UI',sans-serif;min-width:170px;max-width:240px;font-size:11px;">
                                <h4 style="margin:0 0 2px 0;color:#1a2a3a;font-size:12px;">${p.PROVINCIA || 'N/D'} – ${p.DISTRITO || 'N/D'}</h4>
                                ${p.BARR_NOMB ? `<div style="font-size:10px;color:#666;margin-bottom:2px;">📍 ${p.BARR_NOMB}</div>` : ''}
                                <hr style="margin:3px 0;border:0;border-top:1px solid #ddd;">
                                <table style="width:100%;font-size:10px;line-height:1.4;">
                                    <tr><td><strong>Viviendas:</strong></td><td>${p.VIVIENDA || 0}</td></tr>
                                    <tr><td><strong>Personas:</strong></td><td>${p.V_PERSONAS || 0}</td></tr>
                                    <tr><td><strong>Ocupadas:</strong></td><td>${p.VIV_OCUP || 0}</td></tr>
                                    <tr><td><strong>% Ocupación:</strong></td><td>${p.PORC_OCU ? p.PORC_OCU.toFixed(1) : 0}%</td></tr>
                                    <tr><td><strong>Densidad:</strong></td><td>${p.DENS_POB ? p.DENS_POB.toFixed(1) : 0} hab/km²</td></tr>
                                    <tr><td><strong>Pers./viv. ocupada:</strong></td><td>${p.PERS_VIV ? p.PERS_VIV.toFixed(2) : 0}</td></tr>
                                    <tr><td><strong>Categoría:</strong></td><td>${p.CAT_DENS || 'Sin datos'}</td></tr>
                                    <tr><td><strong>Área:</strong></td><td>${areaKm2.toFixed(2)} km² (${areaM2.toFixed(0)} m²)</td></tr>
                                </table>
                            </div>
                        `;
                    layer.bindPopup(popupContent);

                    layer.on('mouseover', function() {
                        this.setStyle({ weight: 2.5, color: '#000000', fillOpacity: 0.95 });
                        this.bringToFront();
                    });
                    layer.on('mouseout', function() {
                        const val = this.feature.properties[variable];
                        let color = '#b0b0b0';
                        if (variable === 'CAT_DENS') {
                            color = catColors[val] || '#b0b0b0';
                        } else {
                            const n = parseFloat(val);
                            if (!isNaN(n) && n !== null) {
                                const r = rangosFijos[variable];
                                const min = r ? r.min : 0;
                                const max = r ? r.max : 1;
                                color = getColorByValue(variable, n, min, max);
                            }
                        }
                        this.setStyle({
                            weight: 1,
                            color: '#333333',
                            fillColor: color,
                            fillOpacity: 0.8
                        });
                    });
                }
            }).addTo(map);

            updateLegend(variable, geoJsonFiltrado);

            const label = document.querySelector(`#variable-select option[value="${variable}"]`)?.textContent || variable;
            document.getElementById('info-label').textContent = label;
            document.getElementById('info-value').textContent = 'Clic en un polígono para detalles';
        }

        // ================================================================
        // 9. CONSTRUIR FILTROS
        // ================================================================
        function construirFiltros(variable) {
            const container = document.getElementById('filtros-container');
            let html = '';
            let items = [];
            let nombres = [];

            if (variable === 'CAT_DENS') {
                items = ['MUY_BAJA', 'BAJA', 'MEDIA_BAJA', 'MEDIA', 'ALTA', 'MUY_ALTA', 'SIN_DATOS'];
                nombres = items.map(c => catLabels[c]);
                html = `<h4>🔍 Filtrar por categoría:</h4>`;
                html += `<div class="select-all-container">
                            <button onclick="toggleAllFiltros(true)">✅ Todo</button>
                            <button onclick="toggleAllFiltros(false)">❌ Nada</button>
                        </div>`;
                for (let i = 0; i < items.length; i++) {
                    const key = items[i];
                    const checked = filtrosActivos[key] !== false;
                    html += `
                            <label class="filtro-checkbox">
                                <input type="checkbox" value="${key}" ${checked ? 'checked' : ''} />
                                <span class="color-muestra" style="background:${catColors[key]};"></span>
                                <span>${nombres[i]}</span>
                                <span class="count-badge" id="count-${key}">0</span>
                            </label>
                        `;
                }
            } else {
                let stepCount = 5;
                let nombresRango = ['Muy bajo', 'Bajo', 'Medio', 'Alto', 'Muy alto'];

                if (variable === 'DENS_POB') {
                    stepCount = 6;
                    nombresRango = [
                        'Muy baja (<100)',
                        'Baja (100-500)',
                        'Media-Baja (500-2000)',
                        'Media (2000-5000)',
                        'Alta (5000-10000)',
                        'Muy alta (>10000)'
                    ];
                } else if (rangosFijos[variable]) {
                    const r = rangosFijos[variable];
                    stepCount = r.steps;
                    nombresRango = r.nombres;
                }

                html = `<h4>🔍 Filtrar por rango:</h4>`;
                html += `<div class="select-all-container">
                            <button onclick="toggleAllFiltros(true)">✅ Todo</button>
                            <button onclick="toggleAllFiltros(false)">❌ Nada</button>
                        </div>`;
                for (let i = 0; i < stepCount; i++) {
                    const key = `rango_${i}`;
                    const checked = filtrosActivos[key] !== false;
                    const color = getColorByValue(variable, i / stepCount, 0, 1);
                    html += `
                            <label class="filtro-checkbox">
                                <input type="checkbox" value="${key}" ${checked ? 'checked' : ''} />
                                <span class="color-muestra" style="background:${color};"></span>
                                <span>${nombresRango[i]}</span>
                                <span class="count-badge" id="count-${key}">0</span>
                            </label>
                        `;
                }
            }

            html += `<button class="btn-reset" onclick="resetFiltros()">🔄 Restablecer filtros</button>`;
            container.innerHTML = html;

            document.querySelectorAll('.filtro-checkbox input[type="checkbox"]').forEach(cb => {
                cb.addEventListener('change', function() {
                    filtrosActivos[this.value] = this.checked;
                    updateMapWithFilters();
                    actualizarContadores();
                });
            });

            actualizarContadores();
        }

        // ================================================================
        // 10. CONTADORES
        // ================================================================
        function actualizarContadores() {
            const variable = currentVariable;
            if (variable === 'CAT_DENS') {
                const categories = ['MUY_BAJA', 'BAJA', 'MEDIA_BAJA', 'MEDIA', 'ALTA', 'MUY_ALTA', 'SIN_DATOS'];
                for (const cat of categories) {
                    const count = allFeatures.filter(f => (f.properties['CAT_DENS'] || 'SIN_DATOS') === cat).length;
                    const el = document.getElementById(`count-${cat}`);
                    if (el) el.textContent = count;
                }
            } else {
                let stepCount = 5;
                if (variable === 'DENS_POB') stepCount = 6;
                else if (rangosFijos[variable]) stepCount = rangosFijos[variable].steps;

                for (let i = 0; i < stepCount; i++) {
                    const key = `rango_${i}`;
                    let count = 0;

                    if (variable === 'DENS_POB') {
                        const limites = [0, 100, 500, 2000, 5000, 10000, 20000];
                        count = allFeatures.filter(f => {
                            const val = parseFloat(f.properties[variable]);
                            if (isNaN(val) || val === null) return false;
                            return val >= limites[i] && val < limites[i + 1];
                        }).length;
                    } else if (rangosFijos[variable]) {
                        const r = rangosFijos[variable];
                        const minVal = r.min + (r.max - r.min) * (i / stepCount);
                        const maxVal = r.min + (r.max - r.min) * ((i + 1) / stepCount);
                        count = allFeatures.filter(f => {
                            const val = parseFloat(f.properties[variable]);
                            if (isNaN(val) || val === null) return false;
                            return val >= minVal && val < maxVal;
                        }).length;
                    }

                    const el = document.getElementById(`count-${key}`);
                    if (el) el.textContent = count;
                }
            }
        }

        // ================================================================
        // 11. TOGGLE ALL Y RESET
        // ================================================================
        function toggleAllFiltros(estado) {
            const checkboxes = document.querySelectorAll('.filtro-checkbox input[type="checkbox"]');
            checkboxes.forEach(cb => {
                cb.checked = estado;
                filtrosActivos[cb.value] = estado;
            });
            updateMapWithFilters();
        }

        function resetFiltros() {
            const checkboxes = document.querySelectorAll('.filtro-checkbox input[type="checkbox"]');
            checkboxes.forEach(cb => {
                cb.checked = true;
                filtrosActivos[cb.value] = true;
            });
            // Limpiar búsqueda
            document.getElementById('searchInput').value = '';
            // Restaurar vista completa
            if (geoJsonData) {
                const bounds = L.geoJSON(geoJsonData).getBounds();
                if (bounds.isValid()) {
                    map.fitBounds(bounds, { padding: [20, 20] });
                }
            }
            updateMapWithFilters();
        }

                                <div class="legend-color" style="background:${color};"></div>
                                <span class="legend-text">${r.label}</span>
                            </div>
                        `;
                }
            } else if (variable === 'PERS_VIV') {
                const rangos = [
                    { min: 0, max: 1.2, label: 'Muy bajo (0.0-1.2)' },
                    { min: 1.2, max: 2.4, label: 'Bajo (1.2-2.4)' },

                ];

                for (const r of rangos) {
                    const valorMedio = (r.min + r.max) / 2;
                    const color = getColorByValue('PERS_VIV', valorMedio, 0, 6);
                    html += `
                            <div class="legend-item">
                                <div class="legend-color" style="background:${color};"></div>
                                <span class="legend-text">${r.label}</span>
                            </div>
                        `;
                }
            } else {
                let stepCount = 5;
                let nombres = ['Muy bajo', 'Bajo', 'Medio', 'Alto', 'Muy alto'];
                let minVal = 0,
                    maxVal = 1;

                if (rangosFijos[variable]) {
                    const r = rangosFijos[variable];
                    stepCount = r.steps;
                    nombres = r.nombres;
                    minVal = r.min;
                    maxVal = r.max;
                }

                for (let i = 0; i < stepCount; i++) {
                    const low = minVal + (maxVal - minVal) * (i / stepCount);
                    const high = minVal + (maxVal - minVal) * ((i + 1) / stepCount);
                    const valorMedio = (low + high) / 2;
                    const color = getColorByValue(variable, valorMedio, minVal, maxVal);
                    html += `
                            <div class="legend-item">
                                <div class="legend-color" style="background:${color};"></div>
                                <span class="legend-text">${nombres[i]}</span>
                            </div>
                        `;
                }
            }

            const desc = descripcionIndicador[variable] || '';
            if (desc) {
                html += `<div class="legend-desc">💡 ${desc}</div>';
            }

            legendDiv.innerHTML = html;
        }

        // ================================================================
        // 13. CARGA DEL GEOJSON
        // ================================================================
        async function loadGeoJSON() {
            try {
                const response = await fetch('vivienda_2023.geojson');
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                geoJsonData = data;
                allFeatures = data.features;
                console.log('✅ GeoJSON cargado:', allFeatures.length, 'features');

                const categories = ['MUY_BAJA', 'BAJA', 'MEDIA_BAJA', 'MEDIA', 'ALTA', 'MUY_ALTA', 'SIN_DATOS'];
                for (const cat of categories) filtrosActivos[cat] = true;
                for (let i = 0; i < 6; i++) filtrosActivos[`rango_${i}`] = true;

                const variable = document.getElementById('variable-select').value;
                currentVariable = variable;
                construirFiltros(variable);
                updateMapWithFilters();

                const bounds = L.geoJSON(data).getBounds();
                if (bounds.isValid()) {
                    map.fitBounds(bounds, { padding: [20, 20] });
                }
            } catch (error) {
                console.error('❌ Error:', error);
                document.getElementById('info-box').innerHTML = `
                        <div style="color:#b94a4a;font-weight:bold;">⚠️ Error al cargar los datos</div>
                        <div style="font-size:10px;margin-top:2px;">${error.message}</div>
                        <div style="font-size:10px;margin-top:2px;">Asegúrate de que <strong>vivienda_2023.geojson</strong> esté en la misma carpeta.</div>
                    `;
            }
        }

        // ================================================================
        // 14. EVENTOS
        // ================================================================
        document.getElementById('variable-select').addEventListener('change', function(e) {
            if (geoJsonData) {
                currentVariable = e.target.value;
                if (currentVariable === 'CAT_DENS') {
                    const cats = ['MUY_BAJA', 'BAJA', 'MEDIA_BAJA', 'MEDIA', 'ALTA', 'MUY_ALTA', 'SIN_DATOS'];
                    for (const c of cats) if (filtrosActivos[c] === undefined) filtrosActivos[c] = true;
                } else {
                    let stepCount = 5;
                    if (currentVariable === 'DENS_POB') stepCount = 6;
                    else if (rangosFijos[currentVariable]) stepCount = rangosFijos[currentVariable].steps;
                    for (let i = 0; i < stepCount; i++) {
                        if (filtrosActivos[`rango_${i}`] === undefined) filtrosActivos[`rango_${i}`] = true;
                    }
                }
                // Limpiar búsqueda al cambiar indicador
                document.getElementById('searchInput').value = '';
                construirFiltros(currentVariable);
                updateMapWithFilters();
            }
        });

        document.getElementById('map-select').addEventListener('change', function(e) {
            const value = e.target.value;
            map.removeLayer(satelliteLayer);
            map.removeLayer(osmLayer);
            map.removeLayer(topoLayer);
            if (value === 'satellite') satelliteLayer.addTo(map);
            else if (value === 'osm') osmLayer.addTo(map);
            else if (value === 'topo') topoLayer.addTo(map);
        });

        // Enter en el buscador
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') buscarPoligonos();
        });

        window.toggleAllFiltros = toggleAllFiltros;
        window.resetFiltros = resetFiltros;
        window.buscarPoligonos = buscarPoligonos;
        window.exportarCSV = exportarCSV;
        window.mostrarEstadisticas = mostrarEstadisticas;
        window.closeStats = closeStats;

        // ================================================================
        // 15. INICIO
        // ================================================================
        loadGeoJSON();
        console.log('🗺️ Mapa interactivo iniciado – RAUL VIQUEZ');
    </script>
