<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estudio Socioeconómico - Vivienda 2023</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Estilos personalizados -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
        }
        #map {
            height: 100vh;
            width: 100%;
        }

        /* Panel de control */
        .control-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 18px 22px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            max-width: 280px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            max-height: 95vh;
            overflow-y: auto;
        }
        .control-panel h3 {
            margin-bottom: 12px;
            font-size: 16px;
            color: #1a2a3a;
            border-bottom: 2px solid #d94f4f;
            padding-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .control-panel label {
            font-weight: 600;
            font-size: 13px;
            color: #2c3e50;
            display: block;
            margin-top: 10px;
            margin-bottom: 4px;
        }
        .control-panel select {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: white;
            font-size: 13px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .control-panel select:focus {
            outline: none;
            border-color: #d94f4f;
            box-shadow: 0 0 0 3px rgba(217, 79, 79, 0.2);
        }

        .info-box {
            margin-top: 12px;
            font-size: 13px;
            color: #34495e;
            background: #f8f9fa;
            padding: 10px 12px;
            border-radius: 8px;
            border-left: 4px solid #d94f4f;
            line-height: 1.5;
        }
        .info-box strong {
            color: #1a2a3a;
        }
        .info-box .valor {
            font-weight: 700;
            color: #d94f4f;
        }

        .legend {
            margin-top: 12px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 12px;
        }
        .legend-title {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 6px;
            font-size: 13px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 3px 0;
        }
        .legend-color {
            width: 22px;
            height: 16px;
            border-radius: 4px;
            margin-right: 10px;
            border: 1px solid rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
        }
        .legend-text {
            font-size: 12px;
            color: #2c3e50;
        }

        .footer {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 12px;
            backdrop-filter: blur(2px);
            pointer-events: none;
            white-space: nowrap;
        }

        @media (max-width: 600px) {
            .control-panel {
                top: 10px;
                right: 10px;
                max-width: 220px;
                padding: 12px 14px;
                max-height: 90vh;
            }
            .control-panel h3 {
                font-size: 14px;
            }
            .control-panel select {
                font-size: 12px;
                padding: 6px 8px;
            }
            .legend {
                font-size: 11px;
                padding: 8px;
            }
            .info-box {
                font-size: 12px;
                padding: 8px;
            }
            .footer {
                font-size: 10px;
                padding: 4px 12px;
                bottom: 6px;
            }
        }
    </style>
</head>
<body>

    <!-- Mapa -->
    <div id="map"></div>

    <!-- Panel de control -->
    <div class="control-panel">
        <h3>📊 Explorador socioeconómico</h3>

        <label for="map-select">🗺️ Mapa base:</label>
        <select id="map-select">
            <option value="satellite">🛰️ Satélite</option>
            <option value="osm">🌍 OpenStreetMap</option>
            <option value="topo">🗺️ Topográfico</option>
        </select>

        <label for="variable-select">📈 Indicador:</label>
        <select id="variable-select">
            <option value="CAT_DENS" selected>🏷️ Categoría de densidad</option>
            <option value="DENS_POB">👥 Densidad poblacional</option>
            <option value="VIV_OCUP">🏠 Viviendas ocupadas</option>
            <option value="PORC_OCU">📊 % Ocupación</option>
            <option value="PERS_VIV">👤 Pers. / vivienda ocupada</option>
        </select>

        <div class="info-box" id="info-box">
            <strong id="info-label">Categoría de densidad</strong><br />
            <span id="info-value">Selecciona un polígono</span>
        </div>

        <div id="legend" class="legend">
            <!-- Se llena con JS -->
        </div>
    </div>

    <div class="footer">Datos: Estudio Socioeconómico 2023 – RAUL VIQUEZ</div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // ================================================================
        // 1. MAPA Y CAPAS BASE
        // ================================================================
        const map = L.map('map', {
            center: [8.0, -80.0],
            zoom: 7
        });

        // Definir capas base
        const satelliteLayer = L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri',
                maxZoom: 19
            }
        );

        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        });

        const topoLayer = L.tileLayer(
            'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenTopoMap',
                maxZoom: 17
            }
        );

        // Añadir capa por defecto (satélite)
        satelliteLayer.addTo(map);

        // ================================================================
        // 2. VARIABLES GLOBALES
        // ================================================================
        let currentLayer = null;
        let currentVariable = 'CAT_DENS';
        let geoJsonData = null;
        let minVal = 0,
            maxVal = 1;

        // ================================================================
        // 3. PALETAS DE COLORES ESPECÍFICAS Y VISIBLES (Mínimos sin blanco)
        // ================================================================
        
        // 1. Categorías de densidad (Rojos / Burdeos)
        const catColors = {
            'MUY_BAJA': '#fcbba1', // Mínimo: Salmón claro visible
            'BAJA': '#fc9272',     // Salmón medio
            'MEDIA': '#fb6a4a',    // Naranja-rojo
            'ALTA': '#de2d26',     // Rojo intenso
            'MUY_ALTA': '#a50f15', // Rojo oscuro
            'SIN_DATOS': '#b0b0b0'
        };
        const catLabels = {
            'MUY_BAJA': 'Muy baja (<100 hab/km²)',
            'BAJA': 'Baja (100-500)',
            'MEDIA': 'Media (500-1500)',
            'ALTA': 'Alta (1500-5000)',
            'MUY_ALTA': 'Muy alta (>5000)',
            'SIN_DATOS': 'Sin datos'
        };

        // Paletas específicas de 5 tonos para cada variable numérica
        const numPalettes = {
            // 2. Densidad poblacional: Gama AZULES
            'DENS_POB': [
                '#9ecae1', // Mínimo: Celeste bien visible
                '#6baed6',
                '#4292c6',
                '#2171b5',
                '#084594'  // Máximo: Azul marino profundo
            ],
            // 3. Viviendas ocupadas: Gama VERDES
            'VIV_OCUP': [
                '#a1d99b', // Mínimo: Verde menta visible
                '#74c476',
                '#41ab5d',
                '#238b45',
                '#005a32'  // Máximo: Verde bosque oscuro
            ],
            // 4. % Ocupación: Gama NARANJAS / ÁMBAR
            'PORC_OCU': [
                '#fdd0a2', // Mínimo: Naranja suave visible
                '#fdae6b',
                '#f16913',
                '#d94801',
                '#8c2d04'  // Máximo: Marrón rojizo
            ],
            // 5. Pers. / vivienda ocupada: Gama PURPURAS / VIOLETAS
            'PERS_VIV': [
                '#bcbddc', // Mínimo: Lavanda visible
                '#9e9ac8',
                '#807dba',
                '#6a51a3',
                '#4a1486'  // Máximo: Púrpura oscuro
            ]
        };

        function getColorByValue(variable, value, min, max) {
            if (isNaN(value) || value === null) return '#b0b0b0';
            const palette = numPalettes[variable] || numPalettes['DENS_POB'];
            const t = (value - min) / (max - min + 0.0001);
            const index = Math.min(Math.floor(t * palette.length), palette.length - 1);
            return palette[index];
        }

        // ================================================================
        // 4. LEYENDA DINÁMICA
        // ================================================================
        function updateLegend(variable, data) {
            const legendDiv = document.getElementById('legend');
            let html = `<div class="legend-title">Leyenda</div>`;

            if (variable === 'CAT_DENS') {
                const categories = ['MUY_BAJA', 'BAJA', 'MEDIA', 'ALTA', 'MUY_ALTA', 'SIN_DATOS'];
                for (const cat of categories) {
                    html += `
                        <div class="legend-item">
                            <div class="legend-color" style="background:${catColors[cat]};"></div>
                            <span class="legend-text">${catLabels[cat]}</span>
                        </div>
                    `;
                }
            } else {
                // Variables numéricas: 5 intervalos
                let values = [];
                for (const f of data.features) {
                    const v = parseFloat(f.properties[variable]);
                    if (!isNaN(v) && v !== null) values.push(v);
                }
                if (values.length === 0) {
                    html += '<div class="legend-item">Sin datos</div>';
                } else {
                    const min = Math.min(...values);
                    const max = Math.max(...values);
                    const steps = 5;
                    const step = (max - min) / steps;
                    for (let i = 0; i < steps; i++) {
                        const low = min + i * step;
                        const high = min + (i + 1) * step;
                        const color = getColorByValue(variable, low, min, max);
                        const label = `${low.toFixed(1)} – ${high.toFixed(1)}`;
                        html += `
                            <div class="legend-item">
                                <div class="legend-color" style="background:${color};"></div>
                                <span class="legend-text">${label}</span>
                            </div>
                        `;
                    }
                }
            }
            legendDiv.innerHTML = html;
        }

        // ================================================================
        // 5. ACTUALIZAR MAPA
        // ================================================================
        function updateMap(variable) {
            if (!geoJsonData) return;

            // Eliminar capa anterior
            if (currentLayer) {
                map.removeLayer(currentLayer);
                currentLayer = null;
            }

            // Calcular min/max para variables numéricas
            minVal = Infinity;
            maxVal = -Infinity;
            if (variable !== 'CAT_DENS') {
                for (const f of geoJsonData.features) {
                    const v = parseFloat(f.properties[variable]);
                    if (!isNaN(v) && v !== null) {
                        if (v < minVal) minVal = v;
                        if (v > maxVal) maxVal = v;
                    }
                }
                if (minVal === Infinity) minVal = 0;
                if (maxVal === -Infinity) maxVal = 1;
            }

            // Crear capa con bordes oscuros finos y alta opacidad para resaltar en OSM
            currentLayer = L.geoJSON(geoJsonData, {
                style: function(feature) {
                    let value = feature.properties[variable];
                    let color = '#b0b0b0';

                    if (variable === 'CAT_DENS') {
                        color = catColors[value] || '#b0b0b0';
                    } else {
                        const numVal = parseFloat(value);
                        if (!isNaN(numVal) && numVal !== null) {
                            color = getColorByValue(variable, numVal, minVal, maxVal);
                        }
                    }
                    return {
                        fillColor: color,
                        weight: 1.2,
                        opacity: 0.9,
                        color: '#333333',     // Borde gris oscuro para separar del mapa OSM
                        fillOpacity: 0.85
                    };
                },
                onEachFeature: function(feature, layer) {
                    const p = feature.properties;
                    const popupContent = `
                        <div style="font-family:'Segoe UI',sans-serif;min-width:200px;max-width:300px;">
                            <h4 style="margin:0 0 4px 0;color:#1a2a3a;">${p.PROVINCIA || p.PROV_NOMB || 'N/D'} – ${p.DISTRITO || 'N/D'}</h4>
                            <hr style="margin:4px 0;border:0;border-top:1px solid #ddd;">
                            <table style="width:100%;font-size:13px;line-height:1.6;">
                                <tr><td><strong>Viviendas:</strong></td><td>${p.VIVIENDA || 0}</td></tr>
                                <tr><td><strong>Personas:</strong></td><td>${p.V_PERSONAS || 0}</td></tr>
                                <tr><td><strong>Ocupadas:</strong></td><td>${p.VIV_OCUP || 0}</td></tr>
                                <tr><td><strong>% Ocupación:</strong></td><td>${p.PORC_OCU ? p.PORC_OCU.toFixed(1) : 0}%</td></tr>
                                <tr><td><strong>Densidad:</strong></td><td>${p.DENS_POB ? p.DENS_POB.toFixed(1) : 0} hab/km²</td></tr>
                                <tr><td><strong>Pers./viv. ocupada:</strong></td><td>${p.PERS_VIV ? p.PERS_VIV.toFixed(2) : 0}</td></tr>
                                <tr><td><strong>Categoría:</strong></td><td>${p.CAT_DENS || 'Sin datos'}</td></tr>
                            </table>
                        </div>
                    `;
                    layer.bindPopup(popupContent);

                    // Hover: resaltar
                    layer.on('mouseover', function() {
                        this.setStyle({ weight: 2.5, color: '#000000', fillOpacity: 0.95 });
                        this.bringToFront();
                    });
                    layer.on('mouseout', function() {
                        // Reaplicar estilo original
                        const val = this.feature.properties[variable];
                        let color = '#b0b0b0';
                        if (variable === 'CAT_DENS') {
                            color = catColors[val] || '#b0b0b0';
                        } else {
                            const n = parseFloat(val);
                            if (!isNaN(n) && n !== null) color = getColorByValue(variable, n, minVal, maxVal);
                        }
                        this.setStyle({
                            weight: 1.2,
                            color: '#333333',
                            fillColor: color,
                            fillOpacity: 0.85
                        });
                    });
                }
            }).addTo(map);

            // Leyenda
            updateLegend(variable, geoJsonData);

            // Info box
            const label = document.querySelector(`#variable-select option[value="${variable}"]`)?.textContent || variable;
            document.getElementById('info-label').textContent = label;
            document.getElementById('info-value').textContent = 'Clic en un polígono para detalles';
        }

        // ================================================================
        // 6. CARGA DEL GEOJSON (con fetch)
        // ================================================================
        async function loadGeoJSON() {
            try {
                const response = await fetch('vivienda_2023.geojson');
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                geoJsonData = data;
                console.log('✅ GeoJSON cargado:', data.features.length, 'features');

                const variable = document.getElementById('variable-select').value;
                updateMap(variable);

                // Ajustar vista
                const bounds = L.geoJSON(data).getBounds();
                if (bounds.isValid()) {
                    map.fitBounds(bounds, { padding: [20, 20] });
                }
            } catch (error) {
                console.error('❌ Error:', error);
                document.getElementById('info-box').innerHTML = `
                    <div style="color:#b94a4a;font-weight:bold;">⚠️ Error al cargar los datos</div>
                    <div style="font-size:12px;margin-top:4px;">${error.message}</div>
                    <div style="font-size:12px;margin-top:4px;">Asegúrate de que <strong>vivienda_2023.geojson</strong> esté en la misma carpeta.</div>
                `;
            }
        }

        // ================================================================
        // 7. EVENTOS DE LOS SELECTORES
        // ================================================================
        document.getElementById('variable-select').addEventListener('change', function(e) {
            if (geoJsonData) {
                currentVariable = e.target.value;
                updateMap(currentVariable);
            }
        });

        // Selector de mapa base
        document.getElementById('map-select').addEventListener('change', function(e) {
            const value = e.target.value;
            // Remover todas las capas base
            map.removeLayer(satelliteLayer);
            map.removeLayer(osmLayer);
            map.removeLayer(topoLayer);
            // Añadir la seleccionada
            if (value === 'satellite') {
                satelliteLayer.addTo(map);
            } else if (value === 'osm') {
                osmLayer.addTo(map);
            } else if (value === 'topo') {
                topoLayer.addTo(map);
            }
        });

        // ================================================================
        // 8. INICIO
        // ================================================================
        loadGeoJSON();

        console.log('🗺️ Mapa interactivo iniciado – RAUL VIQUEZ');
    </script>

</body>
</html>
