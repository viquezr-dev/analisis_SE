<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estudio Socioeconómico - Vivienda 2023</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Estilos personalizados -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; }
        #map { height: 100vh; width: 100%; }

        /* Panel de control flotante */
        .control-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(255,255,255,0.95);
            padding: 18px 22px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            max-width: 300px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.3);
            max-height: 90vh;
            overflow-y: auto;
        }
        .control-panel h3 {
            margin-bottom: 12px;
            font-size: 16px;
            color: #1a2a3a;
            border-bottom: 2px solid #2a8b5e;
            padding-bottom: 6px;
            letter-spacing: 0.5px;
        }

        /* Botones para alternar modo de visualización */
        .mode-toggle {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
        }
        .toggle-btn {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid #2a8b5e;
            background: white;
            color: #2a8b5e;
            border-radius: 8px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .toggle-btn.active, .toggle-btn:hover {
            background: #2a8b5e;
            color: white;
        }

        .control-panel label {
            font-weight: 600;
            font-size: 13px;
            color: #2c3e50;
            display: block;
            margin-top: 8px;
            margin-bottom: 4px;
        }
        .control-panel select, .control-panel input[type="range"] {
            width: 100%;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: white;
            font-size: 13px;
            cursor: pointer;
        }
        .control-panel select:focus {
            outline: none;
            border-color: #2a8b5e;
            box-shadow: 0 0 0 3px rgba(42,139,94,0.2);
        }
        .control-panel .info {
            margin-top: 14px;
            font-size: 13px;
            color: #34495e;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            border-left: 4px solid #2a8b5e;
        }
        .control-panel .info span {
            font-weight: 700;
            color: #1a2a3a;
        }

        /* Controles de calor (deslizadores) */
        .heatmap-controls {
            display: none; /* Oculto por defecto en modo polígono */
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #ccc;
        }

        /* Leyenda de rectángulos */
        .legend {
            margin-top: 14px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 12px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 4px 0;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            margin-right: 10px;
            border: 1px solid rgba(0,0,0,0.1);
        }
        .legend-text {
            font-size: 13px;
            color: #2c3e50;
        }

        /* Leyenda de barra de calor continuo */
        .gradient-bar {
            height: 12px;
            width: 100%;
            border-radius: 6px;
            background: linear-gradient(to right, blue, cyan, lime, yellow, red);
            margin-top: 8px;
        }
        .gradient-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #555;
            margin-top: 2px;
        }

        /* Pie de página */
        .footer {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 12px;
            backdrop-filter: blur(2px);
            pointer-events: none;
        }
        @media (max-width: 600px) {
            .control-panel {
                top: 10px;
                right: 10px;
                max-width: 240px;
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>

    <!-- Mapa -->
    <div id="map"></div>

    <!-- Panel de control -->
    <div class="control-panel">
        <h3>📊 Indicador Socioeconómico</h3>
        
        <!-- Botones para cambiar entre Polígonos y Calor -->
        <label>Modo de visualización:</label>
        <div class="mode-toggle">
            <button id="btn-polygon" class="toggle-btn active">🗺️ Polígonos</button>
            <button id="btn-heatmap" class="toggle-btn">🔥 Calor Continuo</button>
        </div>

        <label for="variable-select">Selecciona variable:</label>
        <select id="variable-select">
            <option value="DENS_POB">Densidad poblacional (hab/km²)</option>
            <option value="CAT_DENS" selected>Categoría de densidad</option>
            <option value="VIV_OCUP">Viviendas ocupadas</option>
            <option value="PORC_OCU">% Ocupación</option>
            <option value="PERS_VIV">Personas / vivienda ocupada</option>
        </select>

        <!-- Deslizadores exclusivos para Modo Calor -->
        <div id="heatmap-controls" class="heatmap-controls">
            <label for="radius-slider">Radio del calor (<span id="radius-val">30</span>px):</label>
            <input type="range" id="radius-slider" min="10" max="80" value="30">

            <label for="blur-slider">Difuminado (<span id="blur-val">15</span>px):</label>
            <input type="range" id="blur-slider" min="5" max="40" value="15">
        </div>

        <div class="info" id="info-box">
            <span id="info-label">Categoría de densidad</span><br />
            <span id="info-value">Clic en un polígono para ver detalles</span>
        </div>

        <!-- Leyenda Dinámica (Polígonos o Calor) -->
        <div id="legend" class="legend"></div>
    </div>

    <div class="footer">Datos: Estudio Socioeconómico 2023 – RAUL VIQUEZ</div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-ajax/2.1.0/leaflet.ajax.min.js"></script>
    <!-- Turf.js para calcular centroides -->
    <script src="https://unpkg.com/@turf/turf/turf.min.js"></script>
    <!-- Heatmap.js + Plugin Leaflet -->
    <script src="https://cdn.jsdelivr.net/npm/heatmap.js@2.0.5/build/heatmap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/heatmap.js@2.0.5/plugins/leaflet-heatmap/leaflet-heatmap.js"></script>

    <script>
        // ----------------------------------------------------------------
        // 1. INICIALIZAR MAPA Y CAPAS BASE
        // ----------------------------------------------------------------
        const map = L.map('map').setView([8.0, -80.0], 7);

        // Capa satelital (Esri)
        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri',
            maxZoom: 19
        }).addTo(map);

        // Capa de calles (OpenStreetMap)
        const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        });

        // Selector de Capas Base
        L.control.layers({ "Satélite": satelliteLayer, "Calles": streetLayer }).addTo(map);

        // ----------------------------------------------------------------
        // 2. VARIABLES GLOBALES
        // ----------------------------------------------------------------
        let currentLayer = null;          // Capa GeoJSON interactiva
        let heatmapLayer = null;          // Capa Mapa de Calor
        let currentVariable = 'CAT_DENS'; // Variable seleccionada
        let geoJsonData = null;          // Datos cargados
        let currentMode = 'polygon';      // 'polygon' o 'heatmap'

        // Configurar capa de Mapa de Calor
        const heatmapConfig = {
            "radius": 30,
            "maxOpacity": 0.8,
            "minOpacity": 0.05,
            "blur": 0.75,
            "scaleRadius": false,
            "useLocalExtrema": false,
            latField: 'lat',
            lngField: 'lng',
            valueField: 'count'
        };
        heatmapLayer = new HeatmapOverlay(heatmapConfig);
        map.addLayer(heatmapLayer);

        // ----------------------------------------------------------------
        // 3. PALETAS Y COLORES
        // ----------------------------------------------------------------
        const catColors = {
            'MUY_BAJA': '#f7fcfd',
            'BAJA': '#ccece6',
            'MEDIA': '#99d8c9',
            'ALTA': '#66c2a4',
            'MUY_ALTA': '#2ca25f',
            'SIN_DATOS': '#e0e0e0'
        };
        const catLabels = {
            'MUY_BAJA': 'Muy baja (<100 hab/km²)',
            'BAJA': 'Baja (100-500)',
            'MEDIA': 'Media (500-1500)',
            'ALTA': 'Alta (1500-5000)',
            'MUY_ALTA': 'Muy alta (>5000)',
            'SIN_DATOS': 'Sin datos'
        };

        function getColorByValue(value, min, max) {
            const t = Math.max(0, Math.min(1, (value - min) / (max - min || 1)));
            const r = Math.round(247 - 42 * t);
            const g = Math.round(252 - 158 * t);
            const b = Math.round(253 - 95 * t);
            return `rgb(${r}, ${g}, ${b})`;
        }

        // ----------------------------------------------------------------
        // 4. EXTRAER PUNTOS PARA MAPA DE CALOR
        // ----------------------------------------------------------------
        function extractHeatData(data, variable) {
            let heatPoints = [];
            let maxVal = -Infinity, minVal = Infinity;

            data.features.forEach(feature => {
                let val = parseFloat(feature.properties[variable]);

                if (variable === 'CAT_DENS') {
                    const catOrder = { 'MUY_BAJA': 1, 'BAJA': 2, 'MEDIA': 3, 'ALTA': 4, 'MUY_ALTA': 5 };
                    val = catOrder[feature.properties[variable]] || 0;
                }

                if (isNaN(val) || val === null) val = 0;

                let center;
                try {
                    const centroid = turf.centroid(feature);
                    center = centroid.geometry.coordinates;
                } catch (e) {
                    return;
                }

                if (val > maxVal) maxVal = val;
                if (val < minVal) minVal = val;

                heatPoints.push({ lat: center[1], lng: center[0], count: val });
            });

            return {
                max: maxVal === -Infinity ? 100 : maxVal,
                min: minVal === Infinity ? 0 : minVal,
                data: heatPoints
            };
        }

        // ----------------------------------------------------------------
        // 5. LEYENDA DINÁMICA
        // ----------------------------------------------------------------
        function updateLegend(variable, data) {
            const legendDiv = document.getElementById('legend');
            let html = '<div style="font-weight:600;margin-bottom:6px;color:#2c3e50;">Leyenda</div>';

            if (currentMode === 'heatmap') {
                const heatData = extractHeatData(data, variable);
                html += `
                    <div class="gradient-bar"></div>
                    <div class="gradient-labels">
                        <span>Bajo (${heatData.min.toFixed(1)})</span>
                        <span>Alto (${heatData.max.toFixed(1)})</span>
                    </div>
                `;
            } else {
                if (variable === 'CAT_DENS') {
                    const categories = ['MUY_BAJA', 'BAJA', 'MEDIA', 'ALTA', 'MUY_ALTA', 'SIN_DATOS'];
                    for (const cat of categories) {
                        html += `
                            <div class="legend-item">
                                <div class="legend-color" style="background:${catColors[cat]};"></div>
                                <span class="legend-text">${catLabels[cat]}</span>
                            </div>
                        `;
                    }
                } else {
                    let values = [];
                    for (const feature of data.features) {
                        const val = parseFloat(feature.properties[variable]);
                        if (!isNaN(val) && val !== null) values.push(val);
                    }
                    if (values.length === 0) {
                        html += '<div class="legend-item">Sin datos disponibles</div>';
                    } else {
                        const min = Math.min(...values);
                        const max = Math.max(...values);
                        const steps = 5;
                        const step = (max - min) / steps;
                        for (let i = 0; i < steps; i++) {
                            const low = min + i * step;
                            const high = min + (i + 1) * step;
                            const color = getColorByValue(low, min, max);
                            html += `
                                <div class="legend-item">
                                    <div class="legend-color" style="background:${color};"></div>
                                    <span class="legend-text">${low.toFixed(1)} – ${high.toFixed(1)}</span>
                                </div>
                            `;
                        }
                    }
                }
            }
            legendDiv.innerHTML = html;
        }

        // ----------------------------------------------------------------
        // 6. ACTUALIZAR MAPA Y POLÍGONOS
        // ----------------------------------------------------------------
        function updateMap() {
            if (!geoJsonData) return;

            const variable = currentVariable;

            // Limpiar capa GeoJSON previa
            if (currentLayer) map.removeLayer(currentLayer);

            // Min/Max para variables numéricas
            let minVal = Infinity, maxVal = -Infinity;
            if (variable !== 'CAT_DENS') {
                for (const feature of geoJsonData.features) {
                    const val = parseFloat(feature.properties[variable]);
                    if (!isNaN(val) && val !== null) {
                        if (val < minVal) minVal = val;
                        if (val > maxVal) maxVal = val;
                    }
                }
                if (minVal === Infinity) minVal = 0;
                if (maxVal === -Infinity) maxVal = 1;
            }

            // Modo Calor
            if (currentMode === 'heatmap') {
                const heatData = extractHeatData(geoJsonData, variable);
                heatmapLayer.setData(heatData);
            } else {
                heatmapLayer.setData({ max: 0, data: [] }); // Ocultar calor
            }

            // Crear capa GeoJSON
            currentLayer = L.geoJSON(geoJsonData, {
                style: function(feature) {
                    if (currentMode === 'heatmap') {
                        return {
                            fillColor: 'transparent',
                            fillOpacity: 0.01,
                            color: 'rgba(255,255,255,0.4)',
                            weight: 1
                        };
                    }

                    let value = feature.properties[variable];
                    let color = '#cccccc';

                    if (variable === 'CAT_DENS') {
                        color = catColors[value] || '#cccccc';
                    } else {
                        const numVal = parseFloat(value);
                        if (!isNaN(numVal) && numVal !== null) {
                            color = getColorByValue(numVal, minVal, maxVal);
                        }
                    }

                    return {
                        fillColor: color,
                        weight: 1,
                        opacity: 0.7,
                        color: 'white',
                        fillOpacity: 0.8
                    };
                },
                onEachFeature: function(feature, layer) {
                    const props = feature.properties;
                    const prov = props.PROV_NOMB || props.PROVINCIA || '';
                    const popupContent = `
                        <div style="font-family:'Segoe UI',sans-serif;min-width:200px;">
                            <h4 style="margin:0 0 6px 0;color:#1a2a3a;">${prov} - ${props.DISTRITO || ''}</h4>
                            <hr style="margin:4px 0;border:0;border-top:1px solid #ddd;">
                            <table style="width:100%;font-size:13px;">
                                <tr><td><strong>Viviendas:</strong></td><td>${props.VIVIENDA || 0}</td></tr>
                                <tr><td><strong>Personas:</strong></td><td>${props.V_PERSONAS || 0}</td></tr>
                                <tr><td><strong>Ocupadas:</strong></td><td>${props.VIV_OCUP || 0}</td></tr>
                                <tr><td><strong>% Ocupación:</strong></td><td>${props.PORC_OCU || 0}%</td></tr>
                                <tr><td><strong>Densidad:</strong></td><td>${props.DENS_POB ? props.DENS_POB.toFixed(1) : 0} hab/km²</td></tr>
                                <tr><td><strong>Pers./viv. ocupada:</strong></td><td>${props.PERS_VIV ? props.PERS_VIV.toFixed(2) : 0}</td></tr>
                                <tr><td><strong>Categoría:</strong></td><td>${props.CAT_DENS || 'Sin datos'}</td></tr>
                            </table>
                        </div>
                    `;
                    layer.bindPopup(popupContent);

                    layer.on('mouseover', function() {
                        this.setStyle({ weight: 3, color: '#222', fillOpacity: currentMode === 'heatmap' ? 0.2 : 0.9 });
                        this.bringToFront();
                    });

                    layer.on('mouseout', function() {
                        if (currentMode === 'heatmap') {
                            this.setStyle({ weight: 1, color: 'rgba(255,255,255,0.4)', fillOpacity: 0.01 });
                        } else {
                            const value = this.feature.properties[variable];
                            let color = '#cccccc';
                            if (variable === 'CAT_DENS') {
                                color = catColors[value] || '#cccccc';
                            } else {
                                const numVal = parseFloat(value);
                                if (!isNaN(numVal) && numVal !== null) {
                                    color = getColorByValue(numVal, minVal, maxVal);
                                }
                            }
                            this.setStyle({ weight: 1, color: 'white', fillColor: color, fillOpacity: 0.8 });
                        }
                    });
                }
            }).addTo(map);

            // Actualizar leyenda e info box
            updateLegend(variable, geoJsonData);
            document.getElementById('info-label').innerText = 
                document.querySelector(`#variable-select option[value="${variable}"]`).textContent;
            document.getElementById('info-value').innerText = 'Clic en un polígono para ver detalles';
        }

        // ----------------------------------------------------------------
        // 7. CARGAR GEOJSON
        // ----------------------------------------------------------------
        async function loadGeoJSON() {
            try {
                const response = await fetch('vivienda_2023.geojson');
                if (!response.ok) throw new Error('Error al cargar GeoJSON: ' + response.status);

                geoJsonData = await response.json();
                currentVariable = document.getElementById('variable-select').value;
                updateMap();

                const bounds = L.geoJSON(geoJsonData).getBounds();
                map.fitBounds(bounds, { padding: [20, 20] });

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('info-box').innerHTML = `
                    <div style="color:red;font-weight:bold;">Error al cargar los datos.</div>
                    <div style="font-size:12px;margin-top:6px;">${error.message}</div>
                    <div style="font-size:12px;margin-top:6px;">Asegúrate de ejecutar en un servidor local (Live Server/HTTP).</div>
                `;
            }
        }

        // ----------------------------------------------------------------
        // 8. EVENTOS Y CONTROLES
        // ----------------------------------------------------------------
        // Selector de Variable
        document.getElementById('variable-select').addEventListener('change', function(e) {
            currentVariable = e.target.value;
            updateMap();
        });

        // Cambio de Modo (Polígonos vs Calor)
        document.getElementById('btn-polygon').addEventListener('click', function() {
            currentMode = 'polygon';
            this.classList.add('active');
            document.getElementById('btn-heatmap').classList.remove('active');
            document.getElementById('heatmap-controls').style.display = 'none';
            updateMap();
        });

        document.getElementById('btn-heatmap').addEventListener('click', function() {
            currentMode = 'heatmap';
            this.classList.add('active');
            document.getElementById('btn-polygon').classList.remove('active');
            document.getElementById('heatmap-controls').style.display = 'block';
            updateMap();
        });

        // Controles de Radio y Difuminado para Calor
        document.getElementById('radius-slider').addEventListener('input', function(e) {
            const val = e.target.value;
            document.getElementById('radius-val').innerText = val;
            heatmapLayer.cfg.radius = parseInt(val);
            heatmapLayer._heatmap.configure(heatmapLayer.cfg);
            heatmapLayer._update();
        });

        document.getElementById('blur-slider').addEventListener('input', function(e) {
            const val = e.target.value;
            document.getElementById('blur-val').innerText = val;
            heatmapLayer.cfg.blur = parseFloat(val / 40);
            heatmapLayer._heatmap.configure(heatmapLayer.cfg);
            heatmapLayer._update();
        });

        // Cargar datos al iniciar
        loadGeoJSON();
    </script>
</body>
</html>
