<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estudio Socioeconómico - Vivienda 2023</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    
    <!-- Leaflet JS (PRIMERO) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
        }
        #map {
            height: 100vh;
            width: 100%;
        }

        .control-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 12px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            max-width: 270px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            max-height: 95vh;
            overflow-y: auto;
            font-size: 11px;
        }
        .control-panel h3 {
            font-size: 13px;
            color: #1a2a3a;
            border-bottom: 2px solid #d94f4f;
            padding-bottom: 4px;
            margin-bottom: 6px;
        }
        .control-panel label {
            font-weight: 600;
            font-size: 10px;
            color: #2c3e50;
            display: block;
            margin-top: 5px;
            margin-bottom: 2px;
        }
        .control-panel select {
            width: 100%;
            padding: 3px 6px;
            border-radius: 5px;
            border: 1px solid #ccc;
            background: white;
            font-size: 10px;
            cursor: pointer;
        }
        .control-panel select:focus {
            outline: none;
            border-color: #d94f4f;
            box-shadow: 0 0 0 2px rgba(217, 79, 79, 0.2);
        }

        /* Buscador */
        .search-container {
            margin-top: 5px;
            display: flex;
            gap: 4px;
        }
        .search-container input {
            flex: 1;
            padding: 3px 6px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 10px;
            outline: none;
        }
        .search-container input:focus {
            border-color: #d94f4f;
            box-shadow: 0 0 0 2px rgba(217, 79, 79, 0.2);
        }
        .search-container button {
            padding: 3px 8px;
            border-radius: 5px;
            border: none;
            background: #d94f4f;
            color: white;
            font-size: 10px;
            cursor: pointer;
        }
        .search-container button:hover {
            background: #b33a3a;
        }

        /* Botones de acción */
        .action-buttons {
            display: flex;
            gap: 4px;
            margin-top: 5px;
        }
        .action-buttons button {
            flex: 1;
            padding: 3px 6px;
            border-radius: 5px;
            border: none;
            font-size: 9px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn-export {
            background: #2a8b5e;
            color: white;
        }
        .btn-export:hover {
            background: #1e6b47;
        }

        .btn-heat {
            background: #ffe4e6;
            color: #9f1239;
            border: 1px solid #fecdd3;
        }
        .btn-heat.active {
            background: #f43f5e;
            color: white;
            border-color: #e11d48;
            box-shadow: 0 0 6px rgba(244, 63, 94, 0.4);
        }
        .btn-stats {
            background: #2c6b9e;
            color: white;
        }
        .btn-stats:hover {
            background: #1e4f7a;
        }

        .filtros-container {
            margin-top: 5px;
            padding: 5px 7px;
            background: #f8f9fa;
            border-radius: 5px;
            border-left: 3px solid #d94f4f;
            max-height: 160px;
            overflow-y: auto;
        }
        .filtros-container h4 {
            font-size: 10px;
            color: #1a2a3a;
            margin-bottom: 3px;
        }
        .filtro-checkbox {
            display: flex;
            align-items: center;
            margin: 2px 0;
            font-size: 10px;
            color: #2c3e50;
            cursor: pointer;
            padding: 1px 4px;
            border-radius: 3px;
        }
        .filtro-checkbox:hover {
            background: #e9ecef;
        }
        .filtro-checkbox input[type="checkbox"] {
            margin-right: 5px;
            width: 12px;
            height: 12px;
            accent-color: #d94f4f;
            flex-shrink: 0;
        }
        .filtro-checkbox .color-muestra {
            width: 14px;
            height: 10px;
            border-radius: 2px;
            margin-right: 5px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }
        .filtro-checkbox .count-badge {
            margin-left: auto;
            font-size: 8px;
            background: #e9ecef;
            padding: 0 5px;
            border-radius: 8px;
            color: #555;
        }

        .btn-reset {
            background: #d94f4f;
            color: white;
            border: none;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 9px;
            cursor: pointer;
            margin-top: 3px;
            width: 100%;
            font-weight: 600;
        }
        .btn-reset:hover {
            background: #b33a3a;
        }

        .select-all-container {
            display: flex;
            gap: 4px;
            margin-bottom: 3px;
        }
        .select-all-container button {
            font-size: 9px;
            padding: 1px 6px;
            border: 1px solid #ccc;
            border-radius: 3px;
            background: white;
            cursor: pointer;
        }
        .select-all-container button:hover {
            background: #e9ecef;
        }

        .info-box {
            margin-top: 5px;
            font-size: 10px;
            color: #34495e;
            background: #f8f9fa;
            padding: 5px 7px;
            border-radius: 5px;
            border-left: 3px solid #d94f4f;
            line-height: 1.4;
        }
        .info-box strong {
            color: #1a2a3a;
        }
        .info-box .valor {
            font-weight: 700;
            color: #d94f4f;
        }
        .info-box .stats {
            font-size: 9px;
            color: #666;
            margin-top: 2px;
            border-top: 1px dashed #ddd;
            padding-top: 2px;
        }
        .info-box .stats span {
            font-weight: 700;
            color: #1a2a3a;
        }

        .legend {
            margin-top: 5px;
            padding: 5px 7px;
            background: #f8f9fa;
            border-radius: 5px;
            font-size: 9px;
        }
        .legend-title {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 3px;
            font-size: 10px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 2px 0;
        }
        .legend-color {
            width: 14px;
            height: 10px;
            border-radius: 2px;
            margin-right: 5px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }
        .legend-text {
            font-size: 9px;
            color: #2c3e50;
        }

        .legend-desc {
            font-size: 8px;
            color: #888;
            margin-top: 3px;
            padding-top: 3px;
            border-top: 1px dashed #ddd;
            font-style: italic;
        }

        /* Modal de estadísticas */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(2px);
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        .modal-content h3 {
            font-size: 16px;
            color: #1a2a3a;
            margin-bottom: 12px;
            border-bottom: 2px solid #d94f4f;
            padding-bottom: 6px;
        }
        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 22px;
            cursor: pointer;
            color: #888;
            background: none;
            border: none;
        }
        .modal-close:hover {
            color: #d94f4f;
        }
        .modal-content canvas {
            max-height: 300px;
            max-width: 100%;
        }
        .modal-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 12px;
            font-size: 11px;
        }
        .modal-stats .stat-item {
            background: #f8f9fa;
            padding: 6px 10px;
            border-radius: 5px;
            text-align: center;
        }
        .modal-stats .stat-item .num {
            font-weight: 700;
            color: #d94f4f;
            font-size: 14px;
        }
        .modal-stats .stat-item .label {
            color: #666;
            font-size: 9px;
        }

        .footer {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 3px 12px;
            border-radius: 14px;
            font-size: 9px;
            backdrop-filter: blur(2px);
            pointer-events: none;
            white-space: nowrap;
        }

        @media (max-width: 600px) {
            .control-panel {
                top: 6px;
                right: 6px;
                max-width: 200px;
                padding: 6px 8px;
            }
            .control-panel h3 {
                font-size: 11px;
            }
            .control-panel select {
                font-size: 9px;
                padding: 2px 5px;
            }
            .filtros-container {
                max-height: 120px;
                padding: 4px 5px;
            }
            .filtro-checkbox {
                font-size: 9px;
            }
            .legend {
                font-size: 8px;
                padding: 4px 5px;
            }
            .info-box {
                font-size: 9px;
                padding: 4px 5px;
            }
            .footer {
                font-size: 7px;
                padding: 2px 8px;
            }
            .modal-content {
                padding: 14px;
                max-width: 95%;
            }
            .modal-stats {
                grid-template-columns: 1fr 1fr;
                gap: 4px;
            }
            .search-container input {
                font-size: 9px;
                padding: 2px 4px;
            }
            .action-buttons button {
                font-size: 8px;
                padding: 2px 4px;
            }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Modal de Estadísticas -->
    <div class="modal-overlay" id="statsModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeStats()">&times;</button>
            <h3 id="statsTitle">📊 Estadísticas del indicador</h3>
            <canvas id="statsChart"></canvas>
            <div class="modal-stats" id="statsNumbers">
                <!-- Se llena con JS -->
            </div>
        </div>
    </div>

    <div class="control-panel">
        <h3>📊 Explorador socioeconómico</h3>

        <label for="map-select">🗺️ Mapa base:</label>
        <select id="map-select">
            <option value="satellite">🛰️ Satélite</option>
            <option value="osm">🌍 OpenStreetMap</option>
            <option value="topo">🗺️ Topográfico</option>
        </select>

        <label for="variable-select">📈 Indicador:</label>
        <select id="variable-select">
            <option value="CAT_DENS" selected>🏷️ Categoría de densidad</option>
            <option value="DENS_POB">👥 Densidad poblacional</option>
            <option value="VIV_OCUP">🏠 Viviendas ocupadas</option>
            <option value="PORC_OCU">📊 % Ocupación</option>
            <option value="PERS_VIV">👤 Pers./viv. ocupada</option>
        </select>

        <!-- Buscador -->
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="🔍 Buscar provincia/distrito..." />
            <button onclick="buscarPoligonos()">Buscar</button>
        </div>

        <!-- Botones de acción -->
        <div class="action-buttons">
            <button class="btn-stats" onclick="mostrarEstadisticas()">📊 Estadísticas</button>
            <button class="btn-export" onclick="exportarCSV()">💾 Exportar CSV</button>
            <button class="btn-heat" onclick="toggleHeatmap()">🔥 Calor</button>
        </div>

        <div id="filtros-container" class="filtros-container">
            <!-- Se llena con JS -->
        </div>

        <div class="info-box" id="info-box">
            <strong id="info-label">Categoría de densidad</strong><br />
            <span id="info-value">Selecciona un polígono</span>
            <div class="stats" id="stats-info">Mostrando: <span id="count-mostrados">0</span> de <span id="count-total">0</span> polígonos</div>
        </div>

        <div id="legend" class="legend">
            <!-- Se llena con JS -->
        </div>
    </div>

    <div class="footer">Datos: Estudio Socioeconómico 2023 – RAUL VIQUEZ</div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ================================================================
        // 1. MAPA Y CAPAS BASE
        // ================================================================
        const map = L.map('map', { center: [8.0, -80.0], zoom: 7 });
        // ================================================================
        // LEAFLET.HEAT - CÓDIGO EMBEBIDO (SIN DEPENDENCIAS EXTERNAS)
        // ================================================================
        (function (factory) {
            if (typeof define === 'function' && define.amd) {
                define(['leaflet'], factory);
            } else if (typeof module !== 'undefined' && module.exports) {
                module.exports = factory(require('leaflet'));
            } else {
                factory(L);
            }
        }(function (L) {
            // Simple Heatmap Layer
            L.HeatLayer = L.Layer.extend({
                initialize: function (latlngs, options) {
                    this._latlngs = latlngs || [];
                    L.setOptions(this, options);
                },
                setLatLngs: function (latlngs) {
                    this._latlngs = latlngs;
                    if (this._map) {
                        this._redraw();
                    }
                    return this;
                },
                addLatLng: function (latlng) {
                    this._latlngs.push(latlng);
                    if (this._map) {
                        this._redraw();
                    }
                    return this;
                },
                onAdd: function (map) {
                    this._map = map;
                    this._canvas = L.DomUtil.create('canvas', 'leaflet-heatmap-layer');
                    var size = this._map.getSize();
                    this._canvas.width = size.x;
                    this._canvas.height = size.y;
                    var pane = this._map.getPane('overlayPane');
                    pane.appendChild(this._canvas);
                    this._map.on('moveend', this._redraw, this);
                    this._redraw();
                },
                onRemove: function (map) {
                    this._map.off('moveend', this._redraw, this);
                    var pane = this._map.getPane('overlayPane');
                    pane.removeChild(this._canvas);
                    this._canvas = null;
                    this._map = null;
                },
                _redraw: function () {
                    if (!this._map) return;
                    var size = this._map.getSize();
                    this._canvas.width = size.x;
                    this._canvas.height = size.y;
                    this._canvas.style.width = size.x + 'px';
                    this._canvas.style.height = size.y + 'px';
                    this._draw();
                },
                _draw: function () {
                    var canvas = this._canvas;
                    var ctx = canvas.getContext('2d');
                    var map = this._map;
                    var size = map.getSize();
                    var bounds = map.getBounds();
                    var zoom = map.getZoom();
                    
                    ctx.clearRect(0, 0, size.x, size.y);
                    
                    if (!this._latlngs.length) return;
                    
                    var radius = this.options.radius || 25;
                    var blur = this.options.blur || 15;
                    var maxZoom = this.options.maxZoom || 18;
                    var minOpacity = this.options.minOpacity || 0.05;
                    var gradient = this.options.gradient || {
                        0.0: 'blue',
                        0.2: 'cyan',
                        0.4: 'lime',
                        0.6: 'yellow',
                        0.8: 'orange',
                        1.0: 'red'
                    };
                    
                    // Convertir colores
                    var gradientColors = {};
                    for (var key in gradient) {
                        gradientColors[key] = this._hexToRgb(gradient[key]);
                    }
                    
                    var points = this._latlngs;
                    var maxIntensity = 1;
                    
                    // Encontrar intensidad máxima
                    for (var i = 0; i < points.length; i++) {
                        var p = points[i];
                        var intensity = p[2] || 1;
                        if (intensity > maxIntensity) maxIntensity = intensity;
                    }
                    
                    var scaleFactor = 1 / maxIntensity;
                    
                    // Dibujar cada punto
                    for (var i = 0; i < points.length; i++) {
                        var p = points[i];
                        var lat = p[0];
                        var lng = p[1];
                        var intensity = (p[2] || 1) * scaleFactor;
                        
                        var point = map.latLngToContainerPoint([lat, lng]);
                        var x = point.x;
                        var y = point.y;
                        
                        // Calcular radio basado en zoom
                        var r = radius * Math.pow(2, (zoom - 10) / 3);
                        
                        // Crear gradiente radial
                        var gradientObj = ctx.createRadialGradient(x, y, 0, x, y, r);
                        
                        // Aplicar intensidad
                        var color = this._getColor(intensity, gradientColors);
                        var alpha = Math.max(minOpacity, intensity * 0.8);
                        
                        gradientObj.addColorStop(0, 'rgba(' + color.r + ',' + color.g + ',' + color.b + ',' + alpha + ')');
                        gradientObj.addColorStop(0.5, 'rgba(' + color.r + ',' + color.g + ',' + color.b + ',' + (alpha * 0.6) + ')');
                        gradientObj.addColorStop(1, 'rgba(' + color.r + ',' + color.g + ',' + color.b + ',0)');
                        
                        ctx.fillStyle = gradientObj;
                        ctx.beginPath();
                        ctx.arc(x, y, r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                },
                _hexToRgb: function(hex) {
                    var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                    return result ? {
                        r: parseInt(result[1], 16),
                        g: parseInt(result[2], 16),
                        b: parseInt(result[3], 16)
                    } : { r: 0, g: 0, b: 0 };
                },
                _getColor: function(intensity, gradientColors) {
                    var keys = Object.keys(gradientColors).sort(function(a,b){return parseFloat(a)-parseFloat(b);});
                    for (var i = 0; i < keys.length - 1; i++) {
                        var k1 = parseFloat(keys[i]);
                        var k2 = parseFloat(keys[i+1]);
                        if (intensity >= k1 && intensity <= k2) {
                            var t = (intensity - k1) / (k2 - k1);
                            var c1 = gradientColors[k1];
                            var c2 = gradientColors[k2];
                            return {
                                r: Math.round(c1.r + (c2.r - c1.r) * t),
                                g: Math.round(c1.g + (c2.g - c1.g) * t),
                                b: Math.round(c1.b + (c2.b - c1.b) * t)
                            };
                        }
                    }
                    var lastKey = keys[keys.length - 1];
                    return gradientColors[lastKey];
                }
            });
            
            L.heatLayer = function(latlngs, options) {
                return new L.HeatLayer(latlngs, options);
            };
            
            return L.heatLayer;
        }));
        const satelliteLayer = L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri',
                maxZoom: 19
            }
        );
        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        });
        const topoLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenTopoMap',
            maxZoom: 17
        });

        satelliteLayer.addTo(map);

        // ================================================================
        // 2. VARIABLES GLOBALES
        // ================================================================
        let currentLayer = null;
        let currentVariable = 'CAT_DENS';
        let geoJsonData = null;
        let allFeatures = [];
        let filtrosActivos = {};
        let chartInstance = null;
        let currentFeaturesFiltradas = [];
        let heatLayerInstance = null;
        let mostrarHeatmapActivo = false;

        // ================================================================
        // 3. PALETAS DE COLORES
        // ================================================================
        const catColors = {
            'MUY_BAJA': '#fcbba1',
            'BAJA': '#fc9272',
            'MEDIA_BAJA': '#fb6a4a',
            'MEDIA': '#de2d26',
            'ALTA': '#a50f15',
            'MUY_ALTA': '#67000d',
            'SIN_DATOS': '#b0b0b0'
        };

        const catLabels = {
            'MUY_BAJA': 'Muy baja (<100 hab/km²)',
            'BAJA': 'Baja (100-500)',
            'MEDIA_BAJA': 'Media-Baja (500-2000)',
            'MEDIA': 'Media (2000-5000)',
            'ALTA': 'Alta (5000-10000)',
            'MUY_ALTA': 'Muy alta (>10000)',
            'SIN_DATOS': 'Sin datos'
        };

        const numPalettes = {
            'DENS_POB': ['#fcbba1', '#fc9272', '#fb6a4a', '#de2d26', '#a50f15', '#67000d'],
            'VIV_OCUP': ['#a1d99b', '#74c476', '#41ab5d', '#238b45', '#005a32'],
            'PORC_OCU': ['#fdd0a2', '#fdae6b', '#f16913', '#d94801', '#8c2d04'],
            'PERS_VIV': ['#bcbddc', '#9e9ac8', '#807dba', '#6a51a3', '#4a1486']
        };

        const rangosFijos = {
            'DENS_POB': {
                min: 0,
                max: 20000,
                steps: 6,
                nombres: [
                    'Muy baja (<100)',
                    'Baja (100-500)',
                    'Media-Baja (500-2000)',
                    'Media (2000-5000)',
                    'Alta (5000-10000)',
                    'Muy alta (>10000)'
                ],
                limites: [0, 100, 500, 2000, 5000, 10000, 20000]
            },
            'PERS_VIV': {
                min: 0,
                max: 6,
                steps: 5,
                nombres: ['Muy bajo (0.0–1.2)', 'Bajo (1.2–2.4)', 'Medio (2.4–3.6)', 'Alto (3.6–4.8)', 'Muy alto (4.8–6.0)']
            },
            'PORC_OCU': {
                min: 0,
                max: 100,
                steps: 5,
                nombres: ['Muy bajo (0–20%)', 'Bajo (20–40%)', 'Medio (40–60%)', 'Alto (60–80%)', 'Muy alto (80–100%)']
            },
            'VIV_OCUP': {
                min: 0,
                max: 8000,
                steps: 5,
                nombres: ['Muy bajo (0–1600)', 'Bajo (1600–3200)', 'Medio (3200–4800)', 'Alto (4800–6400)',
                    'Muy alto (6400–8000)'
                ]
            }
        };

        const rangosNombres = {
            'VIV_OCUP': ['Muy pocas', 'Pocas', 'Medias', 'Muchas', 'Muchísimas'],
            'PORC_OCU': ['Muy bajo', 'Bajo', 'Medio', 'Alto', 'Muy alto'],
            'PERS_VIV': ['Muy bajo', 'Bajo', 'Medio', 'Alto', 'Muy alto']
        };

        const descripcionIndicador = {
            'CAT_DENS': 'Clasificación del territorio según densidad poblacional (hab/km²). Útil para identificar zonas urbanas y rurales.',
            'DENS_POB': 'Número de habitantes por kilómetro cuadrado. Indica la concentración poblacional.',
            'VIV_OCUP': 'Cantidad de viviendas actualmente habitadas. Excluye viviendas desocupadas, en construcción o abandonadas.',
            'PORC_OCU': 'Porcentaje de viviendas ocupadas respecto al total. Valores altos indican baja desocupación.',
            'PERS_VIV': 'Promedio de personas por vivienda ocupada. Valores altos pueden indicar hacinamiento.'
        };

        const variableLabels = {
            'CAT_DENS': 'Categoría de densidad',
            'DENS_POB': 'Densidad poblacional (hab/km²)',
            'VIV_OCUP': 'Viviendas ocupadas',
            'PORC_OCU': '% Ocupación',
            'PERS_VIV': 'Personas por vivienda ocupada'
        };

        function getColorByValue(variable, value, min, max) {
            if (isNaN(value) || value === null) return '#b0b0b0';

            if (variable === 'CAT_DENS') {
                return catColors[value] || '#b0b0b0';
            }

            const palette = numPalettes[variable] || numPalettes['DENS_POB'];
            let t;

            if (variable === 'DENS_POB') {
                const limites = [0, 100, 500, 2000, 5000, 10000, 20000];
                for (let i = 0; i < limites.length - 1; i++) {
                    if (value >= limites[i] && value < limites[i + 1]) {
                        t = i / (limites.length - 2);
                        break;
                    }
                }
                if (value >= 20000) t = 1;
                const index = Math.min(Math.floor(t * (palette.length - 1)), palette.length - 1);
                return palette[index];
            }

            if (rangosFijos[variable]) {
                const r = rangosFijos[variable];
                t = (value - r.min) / (r.max - r.min);
                t = Math.max(0, Math.min(1, t));
            } else {
                t = (value - min) / (max - min + 0.0001);
            }
            const index = Math.min(Math.floor(t * palette.length), palette.length - 1);
            return palette[index];
        }

        function getRangoIndex(variable, value) {
            if (isNaN(value) || value === null) return 0;

            if (variable === 'DENS_POB') {
                const limites = [0, 100, 500, 2000, 5000, 10000, 20000];
                for (let i = 0; i < limites.length - 1; i++) {
                    if (value >= limites[i] && value < limites[i + 1]) {
                        return i;
                    }
                }
                return limites.length - 2;
            }

            if (rangosFijos[variable]) {
                const r = rangosFijos[variable];
                const t = (value - r.min) / (r.max - r.min);
                return Math.min(Math.floor(t * r.steps), r.steps - 1);
            }
            return 0;
        }

        function closeStats() {
            document.getElementById('statsModal').classList.remove('active');
            if (chartInstance) {
                chartInstance.destroy();
                chartInstance = null;
            }
        }

        // ================================================================
        // 4. BUSCADOR
        // ================================================================
        function buscarPoligonos() {
            const texto = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!texto || !geoJsonData) return;

            const encontrados = allFeatures.filter(f => {
                const prov = (f.properties.PROVINCIA || '').toLowerCase();
                const dist = (f.properties.DISTRITO || '').toLowerCase();
                return prov.includes(texto) || dist.includes(texto);
            });

            if (encontrados.length === 0) {
                alert('No se encontraron polígonos con: ' + texto);
                return;
            }

            const geoJsonEncontrados = {
                type: 'FeatureCollection',
                features: encontrados
            };

            if (currentLayer) {
                map.removeLayer(currentLayer);
                currentLayer = null;
            }

            currentLayer = L.geoJSON(geoJsonEncontrados, {
                style: function(feature) {
                    let value = feature.properties[currentVariable];
                    let color = '#b0b0b0';
                    if (currentVariable === 'CAT_DENS') {
                        color = catColors[value] || '#b0b0b0';
                    } else {
                        const numVal = parseFloat(value);
                        if (!isNaN(numVal) && numVal !== null) {
                            const r = rangosFijos[currentVariable];
                            const min = r ? r.min : 0;
                            const max = r ? r.max : 1;
                            color = getColorByValue(currentVariable, numVal, min, max);
                        }
                    }
                    return {
                        fillColor: color,
                        weight: 2,
                        opacity: 0.9,
                        color: '#000000',
                        fillOpacity: 0.85
                    };
                },
                onEachFeature: function(feature, layer) {
                    const p = feature.properties;
                    const areaM2 = p.AREA || 0;
                    const areaKm2 = areaM2 / 1000000;

                    const popupContent = `
                            <div style="font-family:'Segoe UI',sans-serif;min-width:170px;max-width:240px;font-size:11px;">
                                <h4 style="margin:0 0 2px 0;color:#1a2a3a;font-size:12px;">${p.PROVINCIA || 'N/D'} – ${p.DISTRITO || 'N/D'}</h4>
                                ${p.BARR_NOMB ? `<div style="font-size:10px;color:#666;margin-bottom:2px;">📍 ${p.BARR_NOMB}</div>` : ''}
                                <hr style="margin:3px 0;border:0;border-top:1px solid #ddd;">
                                <table style="width:100%;font-size:10px;line-height:1.4;">
                                    <tr><td><strong>Viviendas:</strong></td><td>${p.VIVIENDA || 0}</td></tr>
                                    <tr><td><strong>Personas:</strong></td><td>${p.V_PERSONAS || 0}</td></tr>
                                    <tr><td><strong>Ocupadas:</strong></td><td>${p.VIV_OCUP || 0}</td></tr>
                                    <tr><td><strong>% Ocupación:</strong></td><td>${p.PORC_OCU ? p.PORC_OCU.toFixed(1) : 0}%</td></tr>
                                    <tr><td><strong>Densidad:</strong></td><td>${p.DENS_POB ? p.DENS_POB.toFixed(1) : 0} hab/km²</td></tr>
                                    <tr><td><strong>Pers./viv. ocupada:</strong></td><td>${p.PERS_VIV ? p.PERS_VIV.toFixed(2) : 0}</td></tr>
                                    <tr><td><strong>Categoría:</strong></td><td>${p.CAT_DENS || 'Sin datos'}</td></tr>
                                    <tr><td><strong>Área:</strong></td><td>${areaKm2.toFixed(2)} km² (${areaM2.toFixed(0)} m²)</td></tr>
                                </table>
                            </div>
                        `;
                    layer.bindPopup(popupContent);
                }
            }).addTo(map);

            const bounds = L.geoJSON(geoJsonEncontrados).getBounds();
            if (bounds.isValid()) {
                map.fitBounds(bounds, { padding: [40, 40] });
            }

            document.getElementById('count-mostrados').textContent = encontrados.length;
            document.getElementById('count-total').textContent = allFeatures.length;
            document.getElementById('info-value').textContent = `🔍 Resultados de búsqueda: ${encontrados.length} polígonos`;
