<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estudio Socioeconómico - Vivienda 2023</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; }
        #map { height: 100vh; width: 100%; }

        .control-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 18px 22px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            max-width: 320px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            max-height: 95vh;
            overflow-y: auto;
        }
        .control-panel h3 {
            margin-bottom: 12px;
            font-size: 16px;
            color: #1a2a3a;
            border-bottom: 2px solid #d94f4f;
            padding-bottom: 6px;
        }
        .control-panel label {
            font-weight: 600;
            font-size: 13px;
            color: #2c3e50;
            display: block;
            margin-top: 10px;
            margin-bottom: 4px;
        }
        .control-panel select {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: white;
            font-size: 13px;
            cursor: pointer;
        }
        .control-panel select:focus {
            outline: none;
            border-color: #d94f4f;
            box-shadow: 0 0 0 3px rgba(217, 79, 79, 0.2);
        }

        .filtros-container {
            margin-top: 10px;
            padding: 10px 12px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #d94f4f;
            max-height: 250px;
            overflow-y: auto;
        }
        .filtros-container h4 {
            font-size: 13px;
            color: #1a2a3a;
            margin-bottom: 8px;
        }
        .filtro-checkbox {
            display: flex;
            align-items: center;
            margin: 3px 0;
            font-size: 12px;
            color: #2c3e50;
            cursor: pointer;
            padding: 3px 6px;
            border-radius: 4px;
        }
        .filtro-checkbox:hover { background: #e9ecef; }
        .filtro-checkbox input[type="checkbox"] {
            margin-right: 8px;
            cursor: pointer;
            width: 15px;
            height: 15px;
            accent-color: #d94f4f;
            flex-shrink: 0;
        }
        .filtro-checkbox .color-muestra {
            width: 20px;
            height: 14px;
            border-radius: 3px;
            margin-right: 8px;
            border: 1px solid rgba(0,0,0,0.15);
            flex-shrink: 0;
        }
        .filtro-checkbox .count-badge {
            margin-left: auto;
            font-size: 10px;
            background: #e9ecef;
            padding: 1px 8px;
            border-radius: 12px;
            color: #555;
            flex-shrink: 0;
        }

        .btn-reset {
            background: #d94f4f;
            color: white;
            border: none;
            padding: 5px 14px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
            width: 100%;
            font-weight: 600;
        }
        .btn-reset:hover { background: #b33a3a; }

        .select-all-container {
            display: flex;
            gap: 8px;
            margin-bottom: 6px;
        }
        .select-all-container button {
            font-size: 11px;
            padding: 2px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: white;
            cursor: pointer;
        }
        .select-all-container button:hover { background: #e9ecef; }

        .info-box {
            margin-top: 12px;
            font-size: 13px;
            color: #34495e;
            background: #f8f9fa;
            padding: 10px 12px;
            border-radius: 8px;
            border-left: 4px solid #d94f4f;
            line-height: 1.5;
        }
        .info-box strong { color: #1a2a3a; }
        .info-box .valor { font-weight: 700; color: #d94f4f; }
        .info-box .stats {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
            border-top: 1px dashed #ddd;
            padding-top: 4px;
        }
        .info-box .stats span { font-weight: 700; color: #1a2a3a; }

        .legend {
            margin-top: 12px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 12px;
        }
        .legend-title {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 6px;
            font-size: 13px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 3px 0;
        }
        .legend-color {
            width: 22px;
            height: 16px;
            border-radius: 4px;
            margin-right: 10px;
            border: 1px solid rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
        }
        .legend-text { font-size: 12px; color: #2c3e50; }

        .footer {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 12px;
            backdrop-filter: blur(2px);
            pointer-events: none;
            white-space: nowrap;
        }

        @media (max-width: 600px) {
            .control-panel {
                top: 10px;
                right: 10px;
                max-width: 240px;
                padding: 12px 14px;
                max-height: 90vh;
            }
            .control-panel h3 { font-size: 14px; }
            .control-panel select { font-size: 12px; padding: 6px 8px; }
            .legend { font-size: 11px; padding: 8px; }
            .info-box { font-size: 12px; padding: 8px; }
            .footer { font-size: 10px; padding: 4px 12px; bottom: 6px; }
            .filtro-checkbox { font-size: 11px; }
            .filtros-container { max-height: 180px; padding: 8px 10px; }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="control-panel">
        <h3>📊 Explorador socioeconómico</h3>

        <label for="map-select">🗺️ Mapa base:</label>
        <select id="map-select">
            <option value="satellite">🛰️ Satélite</option>
            <option value="osm">🌍 OpenStreetMap</option>
            <option value="topo">🗺️ Topográfico</option>
        </select>

        <label for="variable-select">📈 Indicador:</label>
        <select id="variable-select">
            <option value="CAT_DENS" selected>🏷️ Categoría de densidad</option>
            <option value="DENS_POB">👥 Densidad poblacional</option>
            <option value="VIV_OCUP">🏠 Viviendas ocupadas</option>
            <option value="PORC_OCU">📊 % Ocupación</option>
            <option value="PERS_VIV">👤 Pers. / vivienda ocupada</option>
        </select>

        <div id="filtros-container" class="filtros-container"></div>

        <div class="info-box" id="info-box">
            <strong id="info-label">Categoría de densidad</strong><br />
            <span id="info-value">Selecciona un polígono</span>
            <div class="stats" id="stats-info">Mostrando: <span id="count-mostrados">0</span> de <span id="count-total">0</span> polígonos</div>
        </div>

        <div id="legend" class="legend"></div>
    </div>

    <div class="footer">Datos: Estudio Socioeconómico 2023 – RAUL VIQUEZ</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // ================================================================
        // 1. MAPA Y CAPAS BASE
        // ================================================================
        const map = L.map('map', { center: [8.0, -80.0], zoom: 7 });

        const satelliteLayer = L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri',
                maxZoom: 19
            }
        );

        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        });

        const topoLayer = L.tileLayer(
            'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenTopoMap',
                maxZoom: 17
            }
        );

        satelliteLayer.addTo(map);

        // ================================================================
        // 2. VARIABLES GLOBALES
        // ================================================================
        let currentLayer = null;
        let currentVariable = 'CAT_DENS';
        let geoJsonData = null;
        let allFeatures = [];
        let minVal = 0, maxVal = 1;
        let filtrosActivos = {};

        // ================================================================
        // 3. PALETAS DE COLORES
        // ================================================================

        const catColors = {
            'MUY_BAJA': '#fcbba1',
            'BAJA': '#fc9272',
            'MEDIA': '#fb6a4a',
            'ALTA': '#de2d26',
            'MUY_ALTA': '#a50f15',
            'SIN_DATOS': '#b0b0b0'
        };
        const catLabels = {
            'MUY_BAJA': 'Muy baja (<100 hab/km²)',
            'BAJA': 'Baja (100-500)',
            'MEDIA': 'Media (500-1500)',
            'ALTA': 'Alta (1500-5000)',
            'MUY_ALTA': 'Muy alta (>5000)',
            'SIN_DATOS': 'Sin datos'
        };

        const numPalettes = {
            'DENS_POB': ['#9ecae1', '#6baed6', '#4292c6', '#2171b5', '#084594'],
            'VIV_OCUP': ['#a1d99b', '#74c476', '#41ab5d', '#238b45', '#005a32'],
            'PORC_OCU': ['#fdd0a2', '#fdae6b', '#f16913', '#d94801', '#8c2d04'],
            'PERS_VIV': ['#bcbddc', '#9e9ac8', '#807dba', '#6a51a3', '#4a1486']
        };

        const rangosNombres = {
            'DENS_POB': ['Muy baja', 'Baja', 'Media', 'Alta', 'Muy alta'],
            'VIV_OCUP': ['Muy pocas', 'Pocas', 'Medias', 'Muchas', 'Muchísimas'],
            'PORC_OCU': ['Muy bajo', 'Bajo', 'Medio', 'Alto', 'Muy alto'],
            'PERS_VIV': ['Muy bajo', 'Bajo', 'Medio', 'Alto', 'Muy alto']
        };

        function getColorByValue(variable, value, min, max) {
            if (isNaN(value) || value === null) return '#b0b0b0';
            const palette = numPalettes[variable] || numPalettes['DENS_POB'];
            const t = (value - min) / (max - min + 0.0001);
            const index = Math.min(Math.floor(t * palette.length), palette.length - 1);
            return palette[index];
        }

        // ================================================================
        // 4. FUNCIONES DE FILTROS
        // ================================================================

        function getFiltros(variable) {
            const checkboxes = document.querySelectorAll('.filtro-checkbox input[type="checkbox"]');
            const activos = {};
            checkboxes.forEach(cb => { activos[cb.value] = cb.checked; });
            return { type: 'checkboxes', activos };
        }

        function aplicarFiltros(features, variable) {
            const filtros = getFiltros(variable);
            const activos = filtros.activos;

            const algunActivo = Object.values(activos).some(v => v === true);
            if (!algunActivo) return [];

            return features.filter(f => {
                let key;
                if (variable === 'CAT_DENS') {
                    key = f.properties[variable] || 'SIN_DATOS';
                } else {
                    const val = parseFloat(f.properties[variable]);
                    if (isNaN(val) || val === null) return false;
                    const t = (val - minVal) / (maxVal - minVal + 0.0001);
                    const index = Math.min(Math.floor(t * 5), 4);
                    key = `rango_${index}`;
                }
                return activos[key] !== false;
            });
        }

        // ================================================================
        // 5. ACTUALIZAR MAPA CON FILTROS (POPUP MEJORADO)
        // ================================================================

        function updateMapWithFilters() {
            if (!geoJsonData) return;
            const variable = currentVariable;

            if (currentLayer) {
                map.removeLayer(currentLayer);
                currentLayer = null;
            }

            if (variable !== 'CAT_DENS') {
                minVal = Infinity;
                maxVal = -Infinity;
                for (const f of allFeatures) {
                    const v = parseFloat(f.properties[variable]);
                    if (!isNaN(v) && v !== null) {
                        if (v < minVal) minVal = v;
                        if (v > maxVal) maxVal = v;
                    }
                }
                if (minVal === Infinity) minVal = 0;
                if (maxVal === -Infinity) maxVal = 1;
            }

            const featuresFiltradas = aplicarFiltros(allFeatures, variable);

            document.getElementById('count-mostrados').textContent = featuresFiltradas.length;
            document.getElementById('count-total').textContent = allFeatures.length;

            const geoJsonFiltrado = {
                type: 'FeatureCollection',
                features: featuresFiltradas
            };

            currentLayer = L.geoJSON(geoJsonFiltrado, {
                style: function(feature) {
                    let value = feature.properties[variable];
                    let color = '#b0b0b0';

                    if (variable === 'CAT_DENS') {
                        color = catColors[value] || '#b0b0b0';
                    } else {
                        const numVal = parseFloat(value);
                        if (!isNaN(numVal) && numVal !== null) {
                            color = getColorByValue(variable, numVal, minVal, maxVal);
                        }
                    }
                    return {
                        fillColor: color,
                        weight: 1.2,
                        opacity: 0.9,
                        color: '#333333',
                        fillOpacity: 0.85
                    };
                },
                onEachFeature: function(feature, layer) {
                    const p = feature.properties;
                    
                    // Calcular área en km² (si está en metros)
                    let areaKm2 = 'N/D';
                    if (p.AREA !== undefined && p.AREA !== null && !isNaN(p.AREA)) {
                        areaKm2 = (p.AREA / 1000000).toFixed(2);
                    }
                    
                    // Obtener nombre del barrio
                    const barrioNombre = p.BARR_NOMB || p.BARRIADA || 'N/D';

                    const popupContent = `
                        <div style="font-family:'Segoe UI',sans-serif;min-width:220px;max-width:320px;">
                            <h4 style="margin:0 0 4px 0;color:#1a2a3a;font-size:15px;">${p.PROVINCIA || 'N/D'} – ${p.DISTRITO || 'N/D'}</h4>
                            <div style="font-size:13px;color:#2c3e50;margin-bottom:4px;">
                                <strong>Barrio:</strong> ${barrioNombre}
                            </div>
                            <hr style="margin:4px 0;border:0;border-top:1px solid #ddd;">
                            <table style="width:100%;font-size:13px;line-height:1.6;">
                                <tr><td><strong>Área:</strong></td><td>${areaKm2} km²</td></tr>
                                <tr><td><strong>Viviendas:</strong></td><td>${p.VIVIENDA || 0}</td></tr>
                                <tr><td><strong>Personas:</strong></td><td>${p.V_PERSONAS || 0}</td></tr>
                                <tr><td><strong>Ocupadas:</strong></td><td>${p.VIV_OCUP || 0}</td></tr>
                                <tr><td><strong>% Ocupación:</strong></td><td>${p.PORC_OCU ? p.PORC_OCU.toFixed(1) : 0}%</td></tr>
                                <tr><td><strong>Densidad:</strong></td><td>${p.DENS_POB ? p.DENS_POB.toFixed(1) : 0} hab/km²</td></tr>
                                <tr><td><strong>Pers./viv. ocupada:</strong></td><td>${p.PERS_VIV ? p.PERS_VIV.toFixed(2) : 0}</td></tr>
                                <tr><td><strong>Categoría:</strong></td><td>${p.CAT_DENS || 'Sin datos'}</td></tr>
                            </table>
                        </div>
                    `;
                    layer.bindPopup(popupContent);

                    layer.on('mouseover', function() {
                        this.setStyle({ weight: 2.5, color: '#000000', fillOpacity: 0.95 });
                        this.bringToFront();
                    });
                    layer.on('mouseout', function() {
                        const val = this.feature.properties[variable];
                        let color = '#b0b0b0';
                        if (variable === 'CAT_DENS') {
                            color = catColors[val] || '#b0b0b0';
                        } else {
                            const n = parseFloat(val);
                            if (!isNaN(n) && n !== null) color = getColorByValue(variable, n, minVal, maxVal);
                        }
                        this.setStyle({
                            weight: 1.2,
                            color: '#333333',
                            fillColor: color,
                            fillOpacity: 0.85
                        });
                    });
                }
            }).addTo(map);

            updateLegend(variable, geoJsonFiltrado);

            const label = document.querySelector(`#variable-select option[value="${variable}"]`)?.textContent || variable;
            document.getElementById('info-label').textContent = label;
            document.getElementById('info-value').textContent = 'Clic en un polígono para detalles';
        }

        // ================================================================
        // 6. CONSTRUIR FILTROS
        // ================================================================

        function construirFiltros(variable) {
            const container = document.getElementById('filtros-container');
            let html = '';
            let items = [];

            if (variable === 'CAT_DENS') {
                items = ['MUY_BAJA', 'BAJA', 'MEDIA', 'ALTA', 'MUY_ALTA', 'SIN_DATOS'];
                html = `<h4>🔍 Filtrar por categoría:</h4>`;
                html += `<div class="select-all-container">
                            <button onclick="toggleAllFiltros(true)">✅ Seleccionar todo</button>
                            <button onclick="toggleAllFiltros(false)">❌ Deseleccionar todo</button>
                        </div>`;
                for (const key of items) {
                    const checked = filtrosActivos[key] !== false;
                    html += `
                        <label class="filtro-checkbox">
                            <input type="checkbox" value="${key}" ${checked ? 'checked' : ''} />
                            <span class="color-muestra" style="background:${catColors[key]};"></span>
                            <span>${catLabels[key]}</span>
                            <span class="count-badge" id="count-${key}">0</span>
                        </label>
                    `;
                }
            } else {
                const nombres = rangosNombres[variable] || ['Muy bajo', 'Bajo', 'Medio', 'Alto', 'Muy alto'];
                html = `<h4>🔍 Filtrar por rango:</h4>`;
                html += `<div class="select-all-container">
                            <button onclick="toggleAllFiltros(true)">✅ Seleccionar todo</button>
                            <button onclick="toggleAllFiltros(false)">❌ Deseleccionar todo</button>
                        </div>`;
                for (let i = 0; i < 5; i++) {
                    const key = `rango_${i}`;
                    const checked = filtrosActivos[key] !== false;
                    const color = getColorByValue(variable, i / 4, 0, 1);
                    html += `
                        <label class="filtro-checkbox">
                            <input type="checkbox" value="${key}" ${checked ? 'checked' : ''} />
                            <span class="color-muestra" style="background:${color};"></span>
                            <span>${nombres[i]}</span>
                            <span class="count-badge" id="count-${key}">0</span>
                        </label>
                    `;
                }
            }

            html += `<button class="btn-reset" onclick="resetFiltros()">🔄 Restablecer filtros</button>`;
            container.innerHTML = html;

            document.querySelectorAll('.filtro-checkbox input[type="checkbox"]').forEach(cb => {
                cb.addEventListener('change', function() {
                    filtrosActivos[this.value] = this.checked;
                    updateMapWithFilters();
                    actualizarContadores();
                });
            });

            actualizarContadores();
        }

        // ================================================================
        // 7. CONTADORES
        // ================================================================

        function actualizarContadores() {
            const variable = currentVariable;

            if (variable === 'CAT_DENS') {
                const categories = ['MUY_BAJA', 'BAJA', 'MEDIA', 'ALTA', 'MUY_ALTA', 'SIN_DATOS'];
                for (const cat of categories) {
                    const count = allFeatures.filter(f => (f.properties['CAT_DENS'] || 'SIN_DATOS') === cat).length;
                    const el = document.getElementById(`count-${cat}`);
                    if (el) el.textContent = count;
                }
            } else {
                for (let i = 0; i < 5; i++) {
                    const key = `rango_${i}`;
                    const minR = minVal + (maxVal - minVal) * (i / 5);
                    const maxR = minVal + (maxVal - minVal) * ((i + 1) / 5);
                    const count = allFeatures.filter(f => {
                        const val = parseFloat(f.properties[variable]);
                        if (isNaN(val) || val === null) return false;
                        return val >= minR && val < maxR;
                    }).length;
                    const el = document.getElementById(`count-${key}`);
                    if (el) el.textContent = count;
                }
            }
        }

        // ================================================================
        // 8. TOGGLE ALL Y RESET
        // ================================================================

        function toggleAllFiltros(estado) {
            const checkboxes = document.querySelectorAll('.filtro-checkbox input[type="checkbox"]');
            checkboxes.forEach(cb => {
                cb.checked = estado;
                filtrosActivos[cb.value] = estado;
            });
            updateMapWithFilters();
        }

        function resetFiltros() {
            const checkboxes = document.querySelectorAll('.filtro-checkbox input[type="checkbox"]');
            checkboxes.forEach(cb => {
                cb.checked = true;
                filtrosActivos[cb.value] = true;
            });
            updateMapWithFilters();
        }

        // ================================================================
        // 9. LEYENDA
        // ================================================================

        function updateLegend(variable, data) {
            const legendDiv = document.getElementById('legend');
            let html = `<div class="legend-title">Leyenda</div>`;

            if (variable === 'CAT_DENS') {
                const categories = ['MUY_BAJA', 'BAJA', 'MEDIA', 'ALTA', 'MUY_ALTA', 'SIN_DATOS'];
                for (const cat of categories) {
                    html += `
                        <div class="legend-item">
                            <div class="legend-color" style="background:${catColors[cat]};"></div>
                            <span class="legend-text">${catLabels[cat]}</span>
                        </div>
                    `;
                }
            } else {
                const nombres = rangosNombres[variable] || ['Muy bajo', 'Bajo', 'Medio', 'Alto', 'Muy alto'];
                for (let i = 0; i < 5; i++) {
                    const color = getColorByValue(variable, i / 4, 0, 1);
                    const low = minVal + (maxVal - minVal) * (i / 5);
                    const high = minVal + (maxVal - minVal) * ((i + 1) / 5);
                    html += `
                        <div class="legend-item">
                            <div class="legend-color" style="background:${color};"></div>
                            <span class="legend-text">${nombres[i]} (${low.toFixed(1)} – ${high.toFixed(1)})</span>
                        </div>
                    `;
                }
            }
            legendDiv.innerHTML = html;
        }

        // ================================================================
        // 10. CARGA DEL GEOJSON
        // ================================================================

        async function loadGeoJSON() {
            try {
                const response = await fetch('vivienda_2023.geojson');
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                geoJsonData = data;
                allFeatures = data.features;
                console.log('✅ GeoJSON cargado:', allFeatures.length, 'features');

                const categories = ['MUY_BAJA', 'BAJA', 'MEDIA', 'ALTA', 'MUY_ALTA', 'SIN_DATOS'];
                for (const cat of categories) filtrosActivos[cat] = true;
                for (let i = 0; i < 5; i++) filtrosActivos[`rango_${i}`] = true;

                const variable = document.getElementById('variable-select').value;
                currentVariable = variable;
                construir
